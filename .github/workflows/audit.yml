name: Weekly dependency audit

"on":
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project (locked, dev extra)
        run: uv sync --locked --extra dev --python 3.12

      - name: Run pip-audit
        run: uv run --extra dev pip-audit
