name: CI

"on":
  # Pushes to `main`, plus every pull request, so work is checked before it
  # merges as well as after.
  push:
    branches: [main]
  pull_request:

# One run per ref: a newer push cancels the superseded run instead of
# queueing the whole matrix again for an intermediate commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite must pass on every supported Python (3.10-3.13), both with and
  # without pytest-xdist installed -- eight combinations.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        xdist: [with, without]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install project (locked, dev extra)
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      # Every step after the locked sync runs with --no-sync: a re-sync
      # would reinstall pytest-xdist, which the "without" leg drops here.
      - name: Uninstall pytest-xdist for the "without" leg
        if: matrix.xdist == 'without'
        run: uv pip uninstall pytest-xdist

      - name: Run pytest
        run: uv run --no-sync pytest

  # The whole suite once more, against a real PostgreSQL server. The tests
  # that need one skip wherever VANTAGE_TEST_POSTGRES_URL is unset, as it is
  # in every other job.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # A throwaway container's password, not a secret.
          POSTGRES_PASSWORD: vantage-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # A superuser: the tests create and drop a database of their own each.
      VANTAGE_TEST_POSTGRES_URL: postgresql://postgres:vantage-ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project (locked, dev extra)
        run: uv sync --locked --extra dev --python 3.12

      - name: Run pytest
        run: uv run --no-sync pytest

  # On an unsupported interpreter the plugin must refuse to install, via
  # requires-python, rather than install and then break at import time.
  python-3-9-install-refused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up build Python
        run: uv python install 3.12

      - name: Build the plugin wheel
        run: uv build --wheel --package pytest-vantage -o dist --python 3.12

      - name: Set up Python 3.9
        run: uv python install 3.9

      # Any install failure is not enough: a missing wheel or an unreachable
      # index fails too, and would pass a check that only wants a failure.
      - name: Assert install is refused, not broken at import
        run: |
          uv venv /tmp/py39-refused-check --python 3.9
          shopt -s nullglob
          wheels=(dist/pytest_vantage-*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one plugin wheel in dist/, found ${#wheels[@]}" >&2
            exit 1
          fi
          if out="$(uv pip install --color never --python /tmp/py39-refused-check/bin/python "${wheels[0]}" 2>&1)"; then
            printf '%s\n' "$out"
            echo "expected the Python 3.9 install to be refused by requires-python, but it succeeded" >&2
            exit 1
          fi
          printf '%s\n' "$out"
          # uv wraps its message, so whitespace is collapsed before matching.
          reason="$(printf '%s' "$out" | tr -s '[:space:]' ' ')"
          if ! grep -qE 'pytest-vantage==[^ ]+ depends on Python>=3\.10' <<<"$reason"; then
            echo "the install failed, but not because requires-python refused Python 3.9" >&2
            exit 1
          fi

  # Proves the suite never contacts anything but localhost. The whole suite,
  # real subprocess and socket tests included, runs with every non-loopback
  # outbound connection rejected, and TCP attempts over IPv4 and IPv6 are
  # counted.
  networking-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project (locked, dev extra)
        run: uv sync --locked --extra dev --python 3.12

      # Block the process under test, never the machine: a blanket OUTPUT
      # reject also cuts the runner agent's connection to GitHub and hangs
      # the job, and exempting ESTABLISHED flows does not help because the
      # agent reconnects. Only processes in the `nonet` group are rejected,
      # the suite is the only thing put in it, and loopback stays open.
      - name: Create the blocked group and its rules
        run: |
          sudo groupadd -f nonet
          # Each family's TCP rule has its own chain so its packet counter
          # can be read unambiguously; the counters show the suite attempted
          # nothing, not merely that it survived.
          sudo iptables -N VANTAGE_NONET
          sudo iptables -A VANTAGE_NONET -j REJECT
          sudo iptables -A OUTPUT -m owner --gid-owner nonet ! -o lo -p tcp -j VANTAGE_NONET
          sudo ip6tables -N VANTAGE_NONET6
          sudo ip6tables -A VANTAGE_NONET6 -j REJECT
          sudo ip6tables -A OUTPUT -m owner --gid-owner nonet ! -o lo -p tcp -j VANTAGE_NONET6
          # Non-TCP traffic is blocked but not counted: the suite resolves a
          # deliberately unresolvable host, and counting that DNS (UDP)
          # lookup would fail the assertion below for an unrelated reason.
          sudo iptables -A OUTPUT -m owner --gid-owner nonet ! -o lo -j REJECT
          sudo ip6tables -A OUTPUT -m owner --gid-owner nonet ! -o lo -j REJECT
          # With no IPv6 route, as on GitHub's hosted runners, the kernel
          # fails an IPv6 connect() before any rule sees it, so nothing would
          # be counted. A default route into a dummy interface lets the
          # attempt reach the rules above; anything else sent there is
          # refused at once, as it was without a route.
          if [ -z "$(ip -6 route show default)" ]; then
            sudo ip link add vantage6 type dummy
            sudo sysctl -qw net.ipv6.conf.vantage6.disable_ipv6=0
            sudo ip link set vantage6 up
            sudo ip -6 route add default dev vantage6
            sudo ip6tables -A OUTPUT -o vantage6 -p tcp -j REJECT --reject-with tcp-reset
            sudo ip6tables -A OUTPUT -o vantage6 -j REJECT
          fi
          # The runner's stock sudoers rule allows passwordless sudo as
          # another user but not as another group, so `sudo -g` would prompt.
          echo "$(id -un) ALL=(ALL:ALL) NOPASSWD:ALL" \
            | sudo tee /etc/sudoers.d/99-vantage-nonet >/dev/null

      # Positive control, run first: a counter that never worked also reads
      # zero, so each rule must be shown to count a real attempt.
      - name: Prove the rules count a real attempt
        run: |
          sudo iptables -Z VANTAGE_NONET
          sudo ip6tables -Z VANTAGE_NONET6
          # 203.0.113.1 (RFC 5737) and 2001:db8::1 (RFC 3849) are reserved
          # for documentation and never routed, so these reach nothing even
          # if a rule were absent.
          for address in 203.0.113.1 2001:db8::1; do
            sudo -u "$(id -un)" -g nonet timeout 5 \
              bash -c "exec 3<>/dev/tcp/$address/80" || true
          done
          count() { sudo "$1" -L "$2" -v -n -x | awk '/REJECT/ {print $1; exit}'; }
          v4="$(count iptables VANTAGE_NONET)"
          v6="$(count ip6tables VANTAGE_NONET6)"
          echo "packets the control attempts got rejected: IPv4 ${v4:-0}, IPv6 ${v6:-0}"
          if [ "${v4:-0}" -lt 1 ] || [ "${v6:-0}" -lt 1 ]; then
            echo "a rule never matched, so a zero below would prove nothing" >&2
            exit 1
          fi

      # Same user, different group, never root: root bypasses file-permission
      # checks, so the tests that revoke access to a path would skip or fail.
      #
      # `uv` by absolute path: sudo replaces PATH from its own `secure_path`
      # and `--preserve-env=PATH` does not override that, so a bare `uv`
      # resolves to nothing.
      - name: Run the suite with outbound networking blocked
        run: >
          sudo iptables -Z VANTAGE_NONET &&
          sudo ip6tables -Z VANTAGE_NONET6 &&
          sudo -u "$(id -un)" -g nonet
          --preserve-env=HOME,UV_CACHE_DIR
          "$(command -v uv)" run --no-sync pytest

      # A passing suite only shows it survived: the plugin deliberately
      # swallows a rejected connection, so no test fails because of one. Only
      # the rules' counters show that no connection was attempted.
      - name: Assert the suite attempted no outbound connection
        run: |
          # `pipefail`, and an empty read is a failure rather than zero, so a
          # failed listing cannot be mistaken for a clean result.
          set -o pipefail
          count() { sudo "$1" -L "$2" -v -n -x | awk '/REJECT/ {print $1; exit}'; }
          v4="$(count iptables VANTAGE_NONET)"
          v6="$(count ip6tables VANTAGE_NONET6)"
          if [ -z "$v4" ] || [ -z "$v6" ]; then
            echo "could not read a rule counter; absence of evidence is not evidence" >&2
            exit 1
          fi
          echo "non-loopback TCP connections the suite attempted: IPv4 $v4, IPv6 $v6"
          if [ "$v4" -ne 0 ] || [ "$v6" -ne 0 ]; then
            sudo iptables -L VANTAGE_NONET -v -n -x
            sudo ip6tables -L VANTAGE_NONET6 -v -n -x
            echo "expected none; nothing beyond the local server may be contacted" >&2
            exit 1
          fi

  # What each install brings, from the built wheels, in fresh environments.
  # Installing pytest-vantage into an environment that already has pytest
  # adds exactly one distribution: the plugin pulls in no third-party
  # dependency and never drags the server in. `vantage` brings the plugin,
  # Pydantic and PyYAML to store runs locally, and no web framework: without
  # the server extra, serving is refused in one line naming it while
  # `vantage push` still runs. `vantage[server]` serves, having given its
  # fresh database the admin `admin` in one line on stderr.
  clean-environment-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_VENV: /tmp/vantage-base
      SERVER_VENV: /tmp/vantage-server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up build Python
        run: uv python install 3.12

      - name: Build both wheels
        run: uv build --wheel --all-packages -o dist --python 3.12

      - name: Assert exactly one distribution is added
        run: |
          uv venv /tmp/clean-install-check --python 3.12
          uv pip install --python /tmp/clean-install-check/bin/python pytest
          uv pip list --python /tmp/clean-install-check/bin/python --format=freeze | sort > before.txt

          uv pip install --python /tmp/clean-install-check/bin/python dist/pytest_vantage-*.whl
          uv pip list --python /tmp/clean-install-check/bin/python --format=freeze | sort > after.txt

          added="$(comm -13 before.txt after.txt)"
          removed="$(comm -23 before.txt after.txt)"
          echo "Added:"
          echo "$added"
          echo "Removed:"
          echo "$removed"

          added_count="$(printf '%s\n' "$added" | grep -c . || true)"
          removed_count="$(printf '%s\n' "$removed" | grep -c . || true)"
          if [ "$added_count" -ne 1 ] || [ "$removed_count" -ne 0 ]; then
            echo "expected exactly one distribution added and none removed/changed" >&2
            exit 1
          fi

      - name: Assert vantage brings the plugin and no web framework
        run: |
          shopt -s nullglob
          vantage_wheels=(dist/vantage-*.whl)
          plugin_wheels=(dist/pytest_vantage-*.whl)
          if [ "${#vantage_wheels[@]}" -ne 1 ] || [ "${#plugin_wheels[@]}" -ne 1 ]; then
            echo "expected one vantage and one pytest-vantage wheel in dist/," \
              "found ${#vantage_wheels[@]} and ${#plugin_wheels[@]}" >&2
            exit 1
          fi
          uv venv "$BASE_VENV" --python 3.12
          # The plugin's wheel alongside, so vantage's dependency on it is
          # this build rather than whatever an index holds under that name.
          uv pip install --python "$BASE_VENV/bin/python" "${vantage_wheels[0]}" "${plugin_wheels[0]}"
          # Names normalised as the packaging spec does, one per line.
          installed="$(uv pip list --python "$BASE_VENV/bin/python" --format=freeze \
            | cut -d= -f1 | tr '[:upper:]_.' '[:lower:]--' | sort)"
          echo "Installed:"
          echo "$installed"
          for name in vantage pytest-vantage pytest pydantic pyyaml; do
            if ! grep -qx "$name" <<<"$installed"; then
              echo "expected vantage to bring $name" >&2
              exit 1
            fi
          done
          for name in fastapi starlette uvicorn; do
            if grep -qx "$name" <<<"$installed"; then
              echo "vantage brought $name, which only the server extra may install" >&2
              exit 1
            fi
          done

      - name: Assert serving without the server extra is refused in one line
        run: |
          home="$(mktemp -d)"
          if out="$(env -u XDG_DATA_HOME -u VANTAGE_DATABASE HOME="$home" "$BASE_VENV/bin/vantage" 2>&1)"; then
            status=0
          else
            status=$?
          fi
          printf '%s\n' "$out"
          expected="vantage: serving needs the server extra: pip install 'vantage[server]'"
          if [ "$status" -ne 1 ] || [ "$out" != "$expected" ]; then
            echo "expected exit status 1 and exactly: $expected" >&2
            exit 1
          fi
          if [ -n "$(ls -A "$home")" ]; then
            echo "the refused start created files under the home directory" >&2
            exit 1
          fi

      - name: Assert vantage push runs without the server extra
        run: |
          home="$(mktemp -d)"
          "$BASE_VENV/bin/vantage" push --help
          out="$(env -u XDG_DATA_HOME HOME="$home" "$BASE_VENV/bin/vantage" push)"
          printf '%s\n' "$out"
          if [[ "$out" != "vantage: nothing queued"* ]]; then
            echo "expected vantage push to find nothing queued in an empty home directory" >&2
            exit 1
          fi
          if [ -n "$(ls -A "$home")" ]; then
            echo "vantage push created files under the home directory" >&2
            exit 1
          fi

      - name: Assert pytest records locally with only vantage installed
        run: |
          home="$(mktemp -d)"
          project="$(mktemp -d)"
          printf 'def test_it():\n    assert True\n' > "$project/test_it.py"
          database="$home/.local/share/vantage/vantage.db"
          if ! out="$(cd "$project" && env -u XDG_DATA_HOME HOME="$home" \
            "$BASE_VENV/bin/python" -m pytest -p no:cacheprovider --vantage --vantage-mode local 2>&1)"; then
            printf '%s\n' "$out"
            echo "the recorded session failed" >&2
            exit 1
          fi
          printf '%s\n' "$out"
          if ! grep -Eq "^vantage: recording run [0-9a-f]{32} in project default to $database\$" <<<"$out"; then
            echo "expected the session to record to $database, where vantage serves by default" >&2
            exit 1
          fi
          if grep -q VantageWarning <<<"$out"; then
            echo "the recorded session warned" >&2
            exit 1
          fi
          if [ ! -f "$database" ]; then
            echo "nothing was stored at $database" >&2
            exit 1
          fi
          # Read back through the store vantage serves it with.
          runs="$("$BASE_VENV/bin/python" -c '
          import sys
          from vantage.storage.sqlite_store import SqliteExecutionStore
          store = SqliteExecutionStore(sys.argv[1])
          print(len(store.list_runs(project="default", limit=10, offset=0).items))
          store.close()
          ' "$database")"
          if [ "$runs" != 1 ]; then
            echo "expected one run stored at $database, found ${runs:-none}" >&2
            exit 1
          fi

      - name: Assert vantage[server] serves
        run: |
          uv venv "$SERVER_VENV" --python 3.12
          vantage_wheel="$(ls dist/vantage-*.whl)"
          plugin_wheel="$(ls dist/pytest_vantage-*.whl)"
          uv pip install --python "$SERVER_VENV/bin/python" \
            "vantage[server] @ file://$PWD/$vantage_wheel" "$plugin_wheel"
          # A fresh database of the server's own: its first start gives it
          # the admin `admin` and prints the password once on stderr, before
          # it answers anything.
          log="$(mktemp)"
          "$SERVER_VENV/bin/vantage" --database "$(mktemp -d)/vantage.db" --port 8765 2>"$log" &
          server=$!
          # The server's stderr is shown however the step ends, with the
          # password masked: a throwaway server's, but a log is no place for
          # one.
          trap 'kill "$server" 2>/dev/null || true
            sed -E "s/(Shown this once: ).*/\1<masked>/" "$log" || true' EXIT
          answer=""
          for _ in $(seq 150); do
            if answer="$(curl -fs http://127.0.0.1:8765/api/v1/capabilities)"; then
              break
            fi
            answer=""
            if ! kill -0 "$server" 2>/dev/null; then
              echo "vantage exited instead of serving" >&2
              exit 1
            fi
            sleep 0.2
          done
          echo "$answer"
          if ! grep -Eq '"session_lifecycle": ?true' <<<"$answer"; then
            echo "expected vantage[server] to answer its capabilities" >&2
            exit 1
          fi
          created="$(grep -Ec '^vantage: created the user admin; .* Shown this once: [^ ]+$' "$log" || true)"
          if [ "$created" != 1 ]; then
            echo "expected one line saying the first start created the user admin, found $created" >&2
            exit 1
          fi

  # The server image, built from this checkout and run as the README runs
  # it: on a fresh volume, whose first start makes the admin; managed with
  # `docker exec`; stopped with `docker stop`. Nothing is pushed anywhere.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: vantage:ci
      CONTAINER: vantage-ci
      VOLUME: vantage-ci-data
      # The runner's end of the published port.
      PORT: "8765"
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag "$IMAGE" .

      - name: Start the image on a fresh volume
        run: |
          docker volume create "$VOLUME"
          docker run --detach --name "$CONTAINER" \
            --publish "127.0.0.1:$PORT:8765" --volume "$VOLUME:/data" "$IMAGE"
          # Healthy once the image's own health check has reached the server.
          health=""
          for _ in $(seq 150); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER")"
            if [ "$health" = healthy ]; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER")" != true ]; then
              echo "the container stopped instead of serving" >&2
              exit 1
            fi
            sleep 0.2
          done
          if [ "$health" != healthy ]; then
            echo "the container never became healthy (${health:-no health status})" >&2
            exit 1
          fi
          answer="$(curl -fsS "http://127.0.0.1:$PORT/api/v1/capabilities")"
          echo "$answer"
          if ! grep -Eq '"session_lifecycle": ?true' <<<"$answer"; then
            echo "expected the published port to answer the capabilities" >&2
            exit 1
          fi

      - name: Assert the first start showed the admin's password once
        run: |
          logs="$(docker logs "$CONTAINER" 2>&1)"
          created="$(grep -Ec '^vantage: created the user admin; .* Shown this once: [^ ]+$' <<<"$logs" || true)"
          if [ "$created" != 1 ]; then
            echo "expected one line saying the first start created the user admin, found $created" >&2
            exit 1
          fi
          # The admin exists before the bind is checked, so serving every
          # interface of the container warns about nothing.
          if grep -q 'Binding to' <<<"$logs"; then
            echo "the server warned that nothing authenticates its requests" >&2
            exit 1
          fi
          if grep -q Traceback <<<"$logs"; then
            echo "the server printed a traceback" >&2
            exit 1
          fi

      - name: Assert a report needs a token
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' --data '{}' \
            "http://127.0.0.1:$PORT/api/v1/runs")"
          if [ "$status" != 401 ]; then
            echo "expected a report without a token to be refused with 401, got $status" >&2
            exit 1
          fi

      - name: Assert a token made with docker exec records a run
        run: |
          # No -t: a terminal would end the token with a carriage return and
          # mix in what the command says on stderr.
          VANTAGE_TOKEN="$(docker exec "$CONTAINER" vantage token create admin --label ci)"
          export VANTAGE_TOKEN
          # The image's own pytest and plugin, reporting to the server beside
          # them; the token is passed by name, never on a command line.
          docker exec --env VANTAGE_TOKEN --workdir /tmp "$CONTAINER" sh -c '
            printf "def test_it():\n    assert True\n" > test_it.py &&
            pytest -p no:cacheprovider --vantage --vantage-server http://127.0.0.1:8765 test_it.py'
          runs="$(curl -fsS -H "Authorization: Bearer $VANTAGE_TOKEN" \
            "http://127.0.0.1:$PORT/api/v1/projects/default/runs")"
          recorded="$(grep -Eo '"recorded_by": ?"admin"' <<<"$runs" | wc -l)"
          if [ "$recorded" -ne 1 ]; then
            echo "expected one run recorded by admin, found $recorded" >&2
            exit 1
          fi

      - name: Assert a restart shows no password
        run: |
          docker restart "$CONTAINER"
          health=""
          for _ in $(seq 150); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER")"
            if [ "$health" = healthy ]; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER")" != true ]; then
              echo "the container stopped instead of serving" >&2
              exit 1
            fi
            sleep 0.2
          done
          if [ "$health" != healthy ]; then
            echo "the restarted container never became healthy (${health:-no health status})" >&2
            exit 1
          fi
          created="$(docker logs "$CONTAINER" 2>&1 | grep -Ec '^vantage: created the user admin' || true)"
          if [ "$created" != 1 ]; then
            echo "expected the restart to add no admin line, found $created in all" >&2
            exit 1
          fi

      - name: Assert docker stop ends it cleanly, with the store closed
        run: |
          docker stop "$CONTAINER"
          status="$(docker inspect --format '{{.State.ExitCode}}' "$CONTAINER")"
          # 137: docker stop gave up waiting for SIGTERM to end it.
          if [ "$status" != 0 ]; then
            echo "expected exit status 0 after SIGTERM, got $status" >&2
            exit 1
          fi
          # A closed store has folded its write-ahead log back into the file.
          left="$(docker run --rm --volume "$VOLUME:/data" --entrypoint ls "$IMAGE" -A /data)"
          if [ "$left" != vantage.db ]; then
            echo "expected vantage.db alone on the volume, found:" $left >&2
            exit 1
          fi

      # The driver is in the image and the URL comes from the environment:
      # nothing listens there, so the start ends in the one-line refusal
      # to connect, never in the one naming the missing postgres extra.
      - name: Assert VANTAGE_DATABASE points the image at PostgreSQL
        run: |
          url=postgresql://vantage@127.0.0.1:1/vantage
          if out="$(docker run --rm --env "VANTAGE_DATABASE=$url" "$IMAGE" 2>&1)"; then
            status=0
          else
            status=$?
          fi
          printf '%s\n' "$out"
          lines="$(printf '%s\n' "$out" | grep -c . || true)"
          if [ "$status" -ne 1 ] || [ "$lines" -ne 1 ] \
            || [[ "$out" != "vantage: cannot open the database at $url: connection failed: "* ]]; then
            echo "expected exit status 1 and one line refusing to connect to $url" >&2
            exit 1
          fi

      - name: Show the server's log without the password
        if: always()
        run: |
          docker logs "$CONTAINER" 2>&1 | sed -E 's/(Shown this once: ).*/\1<masked>/' || true

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project (locked, dev extra)
        run: uv sync --locked --extra dev --python 3.12

      - name: Run ruff format --check
        run: uv run --no-sync ruff format --check .

      - name: Run ruff check
        run: uv run --no-sync ruff check .

      - name: Run mypy --strict
        run: uv run --no-sync mypy .

      # deptry's known false positives are ignored by name in
      # pyproject.toml's [tool.deptry.per_rule_ignores], not silenced wholesale.
      - name: Run deptry
        run: uv run --no-sync deptry .

      - name: Build both distributions (packaging guard)
        run: uv build --wheel --all-packages -o dist
