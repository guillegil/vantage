name: CI

"on":
  # Pushes to `main`, plus every pull request, so work is checked before it
  # merges as well as after.
  push:
    branches: [main]
  pull_request:

# One run per ref: a newer push cancels the superseded run instead of
# queueing the whole matrix again for an intermediate commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite must pass on every supported Python (3.10-3.13), both with and
  # without pytest-xdist installed -- eight combinations.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        xdist: [with, without]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install project (locked, dev extra)
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      # Every step after the locked sync runs with --no-sync: a re-sync
      # would reinstall pytest-xdist, which the "without" leg drops here.
      - name: Uninstall pytest-xdist for the "without" leg
        if: matrix.xdist == 'without'
        run: uv pip uninstall pytest-xdist

      - name: Run pytest
        run: uv run --no-sync pytest

  # The whole suite once more, against a real PostgreSQL server. The tests
  # that need one skip wherever VANTAGE_TEST_POSTGRES_URL is unset, as it is
  # in every other job.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # A throwaway container's password, not a secret.
          POSTGRES_PASSWORD: vantage-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # A superuser: the tests create and drop a database of their own each.
      VANTAGE_TEST_POSTGRES_URL: postgresql://postgres:vantage-ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project (locked, dev extra)
        run: uv sync --locked --extra dev --python 3.12

      - name: Run pytest
        run: uv run --no-sync pytest

  # On an unsupported interpreter the plugin must refuse to install, via
  # requires-python, rather than install and then break at import time.
  python-3-9-install-refused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up build Python
        run: uv python install 3.12

      - name: Build the plugin wheel
        run: uv build --wheel --package pytest-vantage -o dist --python 3.12

      - name: Set up Python 3.9
        run: uv python install 3.9

      # Any install failure is not enough: a missing wheel or an unreachable
      # index fails too, and would pass a check that only wants a failure.
      - name: Assert install is refused, not broken at import
        run: |
          uv venv /tmp/py39-refused-check --python 3.9
          shopt -s nullglob
          wheels=(dist/pytest_vantage-*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one plugin wheel in dist/, found ${#wheels[@]}" >&2
            exit 1
          fi
          if out="$(uv pip install --color never --python /tmp/py39-refused-check/bin/python "${wheels[0]}" 2>&1)"; then
            printf '%s\n' "$out"
            echo "expected the Python 3.9 install to be refused by requires-python, but it succeeded" >&2
            exit 1
          fi
          printf '%s\n' "$out"
          # uv wraps its message, so whitespace is collapsed before matching.
          reason="$(printf '%s' "$out" | tr -s '[:space:]' ' ')"
          if ! grep -qE 'pytest-vantage==[^ ]+ depends on Python>=3\.10' <<<"$reason"; then
            echo "the install failed, but not because requires-python refused Python 3.9" >&2
            exit 1
          fi

  # Proves the suite never contacts anything but localhost. The whole suite,
  # real subprocess and socket tests included, runs with every non-loopback
  # outbound connection rejected, and TCP attempts over IPv4 and IPv6 are
  # counted.
  networking-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project (locked, dev extra)
        run: uv sync --locked --extra dev --python 3.12

      # Block the process under test, never the machine: a blanket OUTPUT
      # reject also cuts the runner agent's connection to GitHub and hangs
      # the job, and exempting ESTABLISHED flows does not help because the
      # agent reconnects. Only processes in the `nonet` group are rejected,
      # the suite is the only thing put in it, and loopback stays open.
      - name: Create the blocked group and its rules
        run: |
          sudo groupadd -f nonet
          # Each family's TCP rule has its own chain so its packet counter
          # can be read unambiguously; the counters show the suite attempted
          # nothing, not merely that it survived.
          sudo iptables -N VANTAGE_NONET
          sudo iptables -A VANTAGE_NONET -j REJECT
          sudo iptables -A OUTPUT -m owner --gid-owner nonet ! -o lo -p tcp -j VANTAGE_NONET
          sudo ip6tables -N VANTAGE_NONET6
          sudo ip6tables -A VANTAGE_NONET6 -j REJECT
          sudo ip6tables -A OUTPUT -m owner --gid-owner nonet ! -o lo -p tcp -j VANTAGE_NONET6
          # Non-TCP traffic is blocked but not counted: the suite resolves a
          # deliberately unresolvable host, and counting that DNS (UDP)
          # lookup would fail the assertion below for an unrelated reason.
          sudo iptables -A OUTPUT -m owner --gid-owner nonet ! -o lo -j REJECT
          sudo ip6tables -A OUTPUT -m owner --gid-owner nonet ! -o lo -j REJECT
          # With no IPv6 route, as on GitHub's hosted runners, the kernel
          # fails an IPv6 connect() before any rule sees it, so nothing would
          # be counted. A default route into a dummy interface lets the
          # attempt reach the rules above; anything else sent there is
          # refused at once, as it was without a route.
          if [ -z "$(ip -6 route show default)" ]; then
            sudo ip link add vantage6 type dummy
            sudo sysctl -qw net.ipv6.conf.vantage6.disable_ipv6=0
            sudo ip link set vantage6 up
            sudo ip -6 route add default dev vantage6
            sudo ip6tables -A OUTPUT -o vantage6 -p tcp -j REJECT --reject-with tcp-reset
            sudo ip6tables -A OUTPUT -o vantage6 -j REJECT
          fi
          # The runner's stock sudoers rule allows passwordless sudo as
          # another user but not as another group, so `sudo -g` would prompt.
          echo "$(id -un) ALL=(ALL:ALL) NOPASSWD:ALL" \
            | sudo tee /etc/sudoers.d/99-vantage-nonet >/dev/null

      # Positive control, run first: a counter that never worked also reads
      # zero, so each rule must be shown to count a real attempt.
      - name: Prove the rules count a real attempt
        run: |
          sudo iptables -Z VANTAGE_NONET
          sudo ip6tables -Z VANTAGE_NONET6
          # 203.0.113.1 (RFC 5737) and 2001:db8::1 (RFC 3849) are reserved
          # for documentation and never routed, so these reach nothing even
          # if a rule were absent.
          for address in 203.0.113.1 2001:db8::1; do
            sudo -u "$(id -un)" -g nonet timeout 5 \
              bash -c "exec 3<>/dev/tcp/$address/80" || true
          done
          count() { sudo "$1" -L "$2" -v -n -x | awk '/REJECT/ {print $1; exit}'; }
          v4="$(count iptables VANTAGE_NONET)"
          v6="$(count ip6tables VANTAGE_NONET6)"
          echo "packets the control attempts got rejected: IPv4 ${v4:-0}, IPv6 ${v6:-0}"
          if [ "${v4:-0}" -lt 1 ] || [ "${v6:-0}" -lt 1 ]; then
            echo "a rule never matched, so a zero below would prove nothing" >&2
            exit 1
          fi

      # Same user, different group, never root: root bypasses file-permission
      # checks, so the tests that revoke access to a path would skip or fail.
      #
      # `uv` by absolute path: sudo replaces PATH from its own `secure_path`
      # and `--preserve-env=PATH` does not override that, so a bare `uv`
      # resolves to nothing.
      - name: Run the suite with outbound networking blocked
        run: >
          sudo iptables -Z VANTAGE_NONET &&
          sudo ip6tables -Z VANTAGE_NONET6 &&
          sudo -u "$(id -un)" -g nonet
          --preserve-env=HOME,UV_CACHE_DIR
          "$(command -v uv)" run --no-sync pytest

      # A passing suite only shows it survived: the plugin deliberately
      # swallows a rejected connection, so no test fails because of one. Only
      # the rules' counters show that no connection was attempted.
      - name: Assert the suite attempted no outbound connection
        run: |
          # `pipefail`, and an empty read is a failure rather than zero, so a
          # failed listing cannot be mistaken for a clean result.
          set -o pipefail
          count() { sudo "$1" -L "$2" -v -n -x | awk '/REJECT/ {print $1; exit}'; }
          v4="$(count iptables VANTAGE_NONET)"
          v6="$(count ip6tables VANTAGE_NONET6)"
          if [ -z "$v4" ] || [ -z "$v6" ]; then
            echo "could not read a rule counter; absence of evidence is not evidence" >&2
            exit 1
          fi
          echo "non-loopback TCP connections the suite attempted: IPv4 $v4, IPv6 $v6"
          if [ "$v4" -ne 0 ] || [ "$v6" -ne 0 ]; then
            sudo iptables -L VANTAGE_NONET -v -n -x
            sudo ip6tables -L VANTAGE_NONET6 -v -n -x
            echo "expected none; nothing beyond the local server may be contacted" >&2
            exit 1
          fi

  # Proves that installing pytest-vantage into an environment that already
  # has pytest adds exactly one distribution: the plugin pulls in no
  # third-party dependency and never drags the server in.
  clean-environment-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up build Python
        run: uv python install 3.12

      - name: Build the plugin wheel
        run: uv build --wheel --package pytest-vantage -o dist --python 3.12

      - name: Assert exactly one distribution is added
        run: |
          uv venv /tmp/clean-install-check --python 3.12
          uv pip install --python /tmp/clean-install-check/bin/python pytest
          uv pip list --python /tmp/clean-install-check/bin/python --format=freeze | sort > before.txt

          uv pip install --python /tmp/clean-install-check/bin/python dist/pytest_vantage-*.whl
          uv pip list --python /tmp/clean-install-check/bin/python --format=freeze | sort > after.txt

          added="$(comm -13 before.txt after.txt)"
          removed="$(comm -23 before.txt after.txt)"
          echo "Added:"
          echo "$added"
          echo "Removed:"
          echo "$removed"

          added_count="$(printf '%s\n' "$added" | grep -c . || true)"
          removed_count="$(printf '%s\n' "$removed" | grep -c . || true)"
          if [ "$added_count" -ne 1 ] || [ "$removed_count" -ne 0 ]; then
            echo "expected exactly one distribution added and none removed/changed" >&2
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project (locked, dev extra)
        run: uv sync --locked --extra dev --python 3.12

      - name: Run ruff format --check
        run: uv run --no-sync ruff format --check .

      - name: Run ruff check
        run: uv run --no-sync ruff check .

      - name: Run mypy --strict
        run: uv run --no-sync mypy .

      # deptry's known false positives are ignored by name in
      # pyproject.toml's [tool.deptry.per_rule_ignores], not silenced wholesale.
      - name: Run deptry
        run: uv run --no-sync deptry .

      - name: Build both distributions (packaging guard)
        run: uv build --wheel --all-packages -o dist
