# Two stages, matched to the time budget each check fits:
#   - `pre-commit` (< 2-3s): ruff format, ruff check --fix, and hygiene
#     hooks, on modified files only. Whole-project passes belong at
#     pre-push or in CI.
#   - `pre-push`: `mypy --strict` over the whole project (a type checker
#     needs every file, not just the changed ones) plus the test suite on
#     one Python version; the version matrix runs in CI.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: mixed-line-ending
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: mypy-strict
        name: mypy --strict (whole project)
        entry: uv run --extra dev mypy .
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: pytest-fast
        name: pytest (fast unit suite)
        entry: uv run --extra dev pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
