[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-vantage"
version = "0.1.0"
description = "Vantage pytest plugin: opt-in test-run recording, reported over HTTP."
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Guillermo Gil" }]

# pytest only. Under ADR-9 this plugin reports over HTTP and never touches a
# database, so it imports nothing outside the standard library -- `urllib`
# for transport, `json` for encoding. RQ-24 permits exactly one added
# distribution beyond the test runner the user already has.
dependencies = ["pytest>=8.0"]

[project.entry-points.pytest11]
vantage = "pytest_vantage.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_vantage"]
