[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vantage-core"
version = "0.1.0"
description = "Vantage core: domain model, storage port and option resolution. Standard library only (RQ-24, RQ-26)."
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Guillermo Gil" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/vantage_core"]
