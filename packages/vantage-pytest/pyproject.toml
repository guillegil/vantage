[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vantage-pytest"
version = "0.1.0"
description = "Vantage pytest plugin: opt-in test-run recording, inert unless --vantage is passed."
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Guillermo Gil" }]
dependencies = ["vantage-core", "vantage-storage", "pytest>=8.0"]

[project.entry-points.pytest11]
vantage = "vantage_pytest.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/vantage_pytest"]
