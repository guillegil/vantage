[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vantage-storage"
version = "0.1.0"
description = "Vantage storage: stdlib sqlite3 adapter and an in-memory adapter for the ExecutionStore port."
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Guillermo Gil" }]
dependencies = ["vantage-core"]

[tool.hatch.build.targets.wheel]
packages = ["src/vantage_storage"]
