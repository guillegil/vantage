[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vantage"
version = "0.1.0"
description = "Vantage: stores the test runs pytest-vantage records, locally or on a server, and serves their history."
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Guillermo Gil" }]

# `vantage` is what a test machine installs to store runs locally as well
# as what a server machine installs: the base brings the plugin, the storage
# and the ingestion that turns a report into stored rows (Pydantic validates
# it, PyYAML parses declared YAML metadata). The HTTP server is the `server`
# extra, the PostgreSQL driver the `postgres` extra. `vantage.core` and
# `vantage.storage` use the standard library only, SQLite included -- except
# `vantage.storage.postgres`, which alone imports the PostgreSQL driver.
dependencies = ["pytest-vantage", "pydantic>=2", "pyyaml>=6.0"]

[project.optional-dependencies]
# `vantage` serving HTTP: the FastAPI app under uvicorn.
server = ["fastapi>=0.115", "uvicorn>=0.30"]
# The PostgreSQL adapter: psycopg 3 with its bundled libpq, and its pool.
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]

[project.scripts]
vantage = "vantage.service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vantage"]
