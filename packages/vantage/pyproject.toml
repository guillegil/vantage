[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vantage"
version = "0.1.0"
description = "Vantage server: records test runs reported over HTTP and serves their history."
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Guillermo Gil" }]

# The repository's first third-party dependency (design.md D12 -- the ADR
# itself, 0011, lands with PR8's docs, not here). SQLite comes from the
# standard library (ADR-6), so `fastapi` -- and the Pydantic v2 it brings --
# is needed only from the ingestion endpoint (PR6) onward. `vantage` is the
# one package RQ-24 does not constrain: it is installed deliberately by
# someone who wants to run a server. `uvicorn` arrives with the `vantage
# serve` CLI (PR9), not here.
dependencies = ["fastapi>=0.115"]

[project.optional-dependencies]
# The extra names the wire protocol, not the vendor: Supabase, Neon, RDS and
# CockroachDB all speak PostgreSQL and all arrive through this one.
postgres = ["psycopg[binary]>=3.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/vantage"]
