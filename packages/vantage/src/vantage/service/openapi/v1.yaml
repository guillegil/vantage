# Hand-written, never generated from `app.routes`. A generated document
# would be the code in another format and could never fail the drift check
# `test_interface_document.py` runs against it.
openapi: 3.1.0
info:
  title: Vantage API
  version: "1"
  description: "read-tagged paths are guaranteed to leave stored data unchanged; write-tagged paths change stored data. Every run belongs to one project, named by the report that creates it or default; the run list, a test's history, the section definitions and the members are a project's and live under /projects/{project}, while every path naming a run id reads that run whatever its project. Every rejection -- each 4xx and 5xx listed here, and the 404 or 405 for a path nothing serves or a method a path does not take -- has the Rejection body. A server bound to a loopback address answers only a request whose Host names localhost, an IP literal (IPv4, or IPv6 in brackets), or a name its operator allowed with --allowed-host or VANTAGE_ALLOWED_HOSTS, whatever its port; one bound wider checks the same way once some name is allowed, and otherwise answers every name. Any other request, and one with no Host, is refused on every path, this document's and the web client's alike, with 421 misdirected_request, whose detail never repeats the name, so a web page that points its own name at the server's address can neither read nor change anything there. The vantage command gives every database it serves an admin user named admin before serving it, printing its password once, unless the database has a user already or pytest-vantage's local store made it. So only a local store's database is ever served with no user: it serves every path without a token but the users-tagged and members-tagged ones, which answer 409 open_server until vantage user add makes its first user. Once a user exists, every path but /capabilities, /openapi.yaml, /login, /password, POST /session and DELETE /session needs a token -- sent as Authorization: Bearer <token>, or held by the session cookie __Host-vantage_session that POST /session sets in a browser -- of an enabled user, not revoked or expired, granting the path's scope: read for what read-tagged paths return, record for a report or a heartbeat, manage for changing a project's sections or members, admin for adding projects and the other users-tagged paths -- the admin scope granting nothing once its user is no longer an admin. Within a project the token's user also needs a role there: viewer to read it, editor to record runs in it and change its sections as well, owner to change its members as well. Every user is an editor of default, which has no members; an admin acts as an owner of every project, a member of it or not; a server with no user checks no role. Scopes and roles only narrow each other: an owner's token granting only read only reads. A user with no role in the project is refused with 403 not_a_member, one whose role is below the one needed with 403 insufficient_role, and neither body names the project. A request is authorized by one credential. The Authorization header decides alone: when it is sent, the cookie is not read. The cookie is read only without the header, never on a server with no user, and only on a request the browser marks Sec-Fetch-Site: same-origin -- or, for a GET, marks none or not at all; any other request carrying it is refused with 403 cross_site_request before the cookie is looked up, since SameSite keeps a cookie from other sites but not from another port of the same host. Browsers keep the cookie only over HTTPS or on a loopback address, and over plain HTTP to another host send no Sec-Fetch-Site. A refusal of the host name comes before everything else, and every refusal of who asks before every refusal of what is asked: 421 misdirected_request, then 401 for no credential, then 403 cross_site_request, then 401 for a token that is not valid, then 403 insufficient_scope, then 409 open_server on a users-tagged or members-tagged path, then the project the path names (404 unknown_project) or the run (422 for its id, 404 unknown_run), then the role, and only then the path's own checks of its body and query. /login, /password and POST /session take a user's name and password instead, and ignore any token; DELETE /session reads the cookie alone. Every 401, and every 403 insufficient_scope, carries a WWW-Authenticate header, a 403's naming the scope the token lacked. Every answer described here carries Content-Security-Policy: default-src 'none'; frame-ancestors 'none', Cache-Control: no-store, X-Content-Type-Options: nosniff, Referrer-Policy: no-referrer, X-Frame-Options: DENY, Cross-Origin-Opener-Policy: same-origin and Cross-Origin-Resource-Policy: same-origin. Paths outside /api are the web client's, which this document does not describe; an unversioned path under /api answers 404."
servers:
  - url: /api/v1
security:
  - bearer: []
  - session: []
  - {}
tags:
  - {name: read, description: Leaves stored data unchanged.}
  - {name: write, description: Changes stored data.}
  - {name: users, description: "Users, their passwords and their tokens. /login, /password and POST /session take a user's name and password; every other users-tagged path needs a token granting the admin scope, on every server. A server with no user -- one serving a database pytest-vantage's local store made -- answers 409 open_server to all of them."}
  - {name: members, description: "A project's members, each with a role in it: viewer, editor or owner. Listing them needs the read scope and the viewer role in the project; setting or removing one, the manage scope and the owner role. default has none, since every user is an editor of it. A server with no user -- one serving a database pytest-vantage's local store made -- answers 409 open_server to all of them."}
paths:
  /runs:
    post:
      operationId: create_run
      tags: [write]
      summary: Report a session's run and its results.
      description: The run belongs to the project the report's project names, or to default when it names none; the project must exist, since a server never makes one from a report, and the token's user must be an editor of it. The report names its project in its body, so the body is checked before the project, the project before the user's role in it, and that role before the run, so a user who may not record in the project learns nothing of the runs in it. Every U+0000, and every lone surrogate, in a key or string value of the body is stored as U+FFFD, and so is every U+0000 a declared metadata document escapes. Metadata values never reject a report. The server bounds them the way the plugin does -- it drops a file repeating an earlier file's path, over-long and repeated keys, a session value with a status it cannot have, and every key past the per-run entry bound, files first; it records a document past the per-file or per-report size as too_large or over_budget without parsing it, and a value past the per-value size as value_too_large. Each key is stored once, by the first report carrying it.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SessionReport'}}}}
      responses:
        "201": {description: "Stored, a new run.", content: {application/json: {schema: {$ref: '#/components/schemas/Acknowledgement'}}}}
        "200": {description: "The run already existed. This report's finish fields, results and metadata were applied where the run did not have them yet; nothing already stored was replaced. A run already finished takes nothing from a later report.", content: {application/json: {schema: {$ref: '#/components/schemas/Acknowledgement'}}}}
        "400": {description: "The body is not UTF-8 JSON (invalid_json) -- NaN and Infinity are not JSON -- or the client disconnected before sending all of it (incomplete_body).", content: &rejection {application/json: {schema: {$ref: '#/components/schemas/Rejection'}}}}
        "401": {description: "No credential -- neither Authorization: Bearer <token> nor the session cookie __Host-vantage_session -- on a server that has users; or a token that is not valid -- unknown, revoked, expired, or of a disabled user -- in the header on any server, or in the cookie on a server that has users (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the record scope (insufficient_scope); or its user is not a member of the project the report names (not_a_member), or their role in it is below editor (insufficient_role). Nothing of the report is stored. A session cookie on a request the browser did not mark Sec-Fetch-Site: same-origin is refused before it is looked up (cross_site_request).", content: *rejection}
        "404": {description: "No project of the name the report gives exists (unknown_project); fields is [project]. Nothing of the report is stored.", content: *rejection}
        "409": {description: "The run was recorded by another user, or without a token when this report has one, or with one when it has none (foreign_run); or it was created in another project (project_mismatch). Nothing of the report is stored.", content: *rejection}
        "413": {description: "The body exceeds 1 MiB (payload_too_large).", content: *rejection}
        "415": {description: "Content-Type is not application/json (unsupported_media_type).", content: *rejection}
        "422": {description: "The body does not match SessionReport (invalid_report), a project that is not a project name included; fields names each failing field.", content: *rejection}
  /runs/{run_id}:
    get:
      operationId: get_run_detail
      tags: [read]
      summary: The full record for one run, with its untruncated commit subject.
      description: "Each run carries its comparison: the run it was compared with, and how many of its tests changed each way against it. A run is compared once, by the report that gives it its exit status, and never again, so the comparison is pending while the run has none -- running, or abandoned until vantage push delivers its end -- and final from then on. Its baseline is the latest complete run of its project started before it (a tie on started_at settled by id) on its own branch, or failing that, or when it has no branch, on any branch; a run is complete when it finished, was neither interrupted nor stopped early, and exited 0 or 1."
      parameters:
        - $ref: '#/components/parameters/run_id'
      responses:
        "200": {description: The run., content: {application/json: {schema: {$ref: '#/components/schemas/RunDetailResponse'}}}}
        "401": {description: "No credential -- neither Authorization: Bearer <token> nor the session cookie __Host-vantage_session -- on a server that has users; or a token that is not valid -- unknown, revoked, expired, or of a disabled user -- in the header on any server, or in the cookie on a server that has users (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope); or its user is not a member of the run's project (not_a_member). A session cookie on a request the browser marked Sec-Fetch-Site other than same-origin or none -- from another site, or another port of this host -- is refused before it is looked up (cross_site_request).", content: *rejection}
        "404": {description: No run with that id has been recorded (unknown_run)., content: *rejection}
        "422": {description: run_id is not 32 lowercase hex characters (invalid_parameter)., content: *rejection}
  /runs/{run_id}/metadata:
    get:
      operationId: get_run_metadata
      tags: [read]
      summary: Every metadata key one run reported, ordered by key, and every file it declared.
      description: Keys read from declared files and keys the test session reported itself alike; source tells them apart. files lists each declared file, ordered by path, with the status that says whether it was read and, if not, why its keys have no value. Not paged -- a run holds at most 200 keys. A run that reported no metadata has no items and no files.
      parameters:
        - $ref: '#/components/parameters/run_id'
      responses:
        "200": {description: The run's metadata., content: {application/json: {schema: {$ref: '#/components/schemas/RunMetadataResponse'}}}}
        "401": {description: "No credential -- neither Authorization: Bearer <token> nor the session cookie __Host-vantage_session -- on a server that has users; or a token that is not valid -- unknown, revoked, expired, or of a disabled user -- in the header on any server, or in the cookie on a server that has users (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope); or its user is not a member of the run's project (not_a_member). A session cookie on a request the browser marked Sec-Fetch-Site other than same-origin or none -- from another site, or another port of this host -- is refused before it is looked up (cross_site_request).", content: *rejection}
        "404": {description: No run with that id has been recorded (unknown_run)., content: *rejection}
        "422": {description: run_id is not 32 lowercase hex characters (invalid_parameter)., content: *rejection}
  /runs/{run_id}/heartbeat:
    post:
      operationId: heartbeat
      tags: [write]
      summary: Advance a run's last-contact timestamp.
      parameters:
        - $ref: '#/components/parameters/run_id'
      responses:
        "200": {description: Acknowledged., content: {application/json: {schema: {$ref: '#/components/schemas/HeartbeatAcknowledgement'}}}}
        "401": {description: "No credential -- neither Authorization: Bearer <token> nor the session cookie __Host-vantage_session -- on a server that has users; or a token that is not valid -- unknown, revoked, expired, or of a disabled user -- in the header on any server, or in the cookie on a server that has users (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the record scope (insufficient_scope); or its user is not a member of the run's project (not_a_member), or their role in it is below editor (insufficient_role). A session cookie on a request the browser did not mark Sec-Fetch-Site: same-origin is refused before it is looked up (cross_site_request).", content: *rejection}
        "404": {description: No run with that id has been recorded (unknown_run)., content: *rejection}
        "409": {description: "The run was recorded by another user, or without a token when this heartbeat has one, or with one when it has none (foreign_run).", content: *rejection}
        "422": {description: run_id is not 32 lowercase hex characters (invalid_parameter)., content: *rejection}
  /runs/{run_id}/results:
    get:
      operationId: list_results
      tags: [read]
      summary: Page through one run's results.
      description: "Results come in stored order, the order the plugin reported them. outcome, repeated once per outcome wanted -- ?outcome=failed&outcome=error&outcome=xpassed -- keeps only the results holding one of them, and limit, offset and has_more page over those alone."
      parameters:
        - $ref: '#/components/parameters/run_id'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - {name: outcome, in: query, required: false, description: "Only results with one of these outcomes; absent, every result.", schema: {type: array, items: {type: string, enum: [passed, failed, error, skipped, xfailed, xpassed]}}}
      responses:
        "200": {description: A page of results., content: {application/json: {schema: {$ref: '#/components/schemas/ResultsResponse'}}}}
        "401": {description: "No credential -- neither Authorization: Bearer <token> nor the session cookie __Host-vantage_session -- on a server that has users; or a token that is not valid -- unknown, revoked, expired, or of a disabled user -- in the header on any server, or in the cookie on a server that has users (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope); or its user is not a member of the run's project (not_a_member). A session cookie on a request the browser marked Sec-Fetch-Site other than same-origin or none -- from another site, or another port of this host -- is refused before it is looked up (cross_site_request).", content: *rejection}
        "404": {description: No run with that id has been recorded (unknown_run)., content: *rejection}
        "422": {description: "run_id is not 32 lowercase hex characters; or, once the run is found and the caller may read it, limit below 1 or offset out of range -- not a page -- or an outcome that is not one of the six, whose fields is [query.outcome] (invalid_parameter).", content: *rejection}
  /runs/{run_id}/changes:
    get:
      operationId: list_changes
      tags: [read]
      summary: Page through the tests that changed in one run against its baseline.
      description: "The tests whose change the run's comparison records, in the order they need looking at: new_failure, still_failing, fixed, new_test, then removed or not_reached -- the tests the baseline has and the run lacks -- and within each change in the run's stored order, a missing test in the baseline's. A test that did not change is not listed. A run whose comparison is pending (no exit status yet) or none (no earlier complete run) has none, so its page is empty. change, repeated once per change wanted -- ?change=new_failure&change=still_failing -- keeps only the tests holding one of them, and limit, offset and has_more page over those alone."
      parameters:
        - $ref: '#/components/parameters/run_id'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - {name: change, in: query, required: false, description: "Only tests with one of these changes; absent, every change.", schema: {type: array, items: {type: string, enum: [new_failure, still_failing, fixed, new_test, removed, not_reached]}}}
      responses:
        "200": {description: A page of changed tests., content: {application/json: {schema: {$ref: '#/components/schemas/ChangesResponse'}}}}
        "401": {description: "No credential -- neither Authorization: Bearer <token> nor the session cookie __Host-vantage_session -- on a server that has users; or a token that is not valid -- unknown, revoked, expired, or of a disabled user -- in the header on any server, or in the cookie on a server that has users (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope); or its user is not a member of the run's project (not_a_member). A session cookie on a request the browser marked Sec-Fetch-Site other than same-origin or none -- from another site, or another port of this host -- is refused before it is looked up (cross_site_request).", content: *rejection}
        "404": {description: No run with that id has been recorded (unknown_run)., content: *rejection}
        "422": {description: "run_id is not 32 lowercase hex characters; or, once the run is found and the caller may read it, limit below 1 or offset out of range -- not a page -- or a change that is not one of the six, whose fields is [query.change] (invalid_parameter).", content: *rejection}
  /runs/{run_id}/outcomes:
    get:
      operationId: get_run_outcomes
      tags: [read]
      summary: Every outcome of one run, in the order the plugin reported them.
      description: "One of pytest's own characters per result, in stored order: . passed, F failed, E error, s skipped, x xfailed, X xpassed. Stored order is the order the plugin reported results, which is the order they ran in; under pytest-xdist the workers' results interleave. Not paged: a byte a result. A run still running has none until its results are reported. changes is aligned with outcomes, one character per result -- - unchanged, n new_failure, s still_failing, f fixed, t new_test -- against the run's baseline; it is null while the comparison is pending (no exit status yet) and when it is none (no earlier complete run), and a test the run lacks has no character in either."
      parameters:
        - $ref: '#/components/parameters/run_id'
      responses:
        "200": {description: The run's outcomes., content: {application/json: {schema: {$ref: '#/components/schemas/RunOutcomesResponse'}}}}
        "401": {description: "No credential -- neither Authorization: Bearer <token> nor the session cookie __Host-vantage_session -- on a server that has users; or a token that is not valid -- unknown, revoked, expired, or of a disabled user -- in the header on any server, or in the cookie on a server that has users (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope); or its user is not a member of the run's project (not_a_member). A session cookie on a request the browser marked Sec-Fetch-Site other than same-origin or none -- from another site, or another port of this host -- is refused before it is looked up (cross_site_request).", content: *rejection}
        "404": {description: No run with that id has been recorded (unknown_run)., content: *rejection}
        "422": {description: run_id is not 32 lowercase hex characters (invalid_parameter)., content: *rejection}
  /runs/{run_id}/result:
    get:
      operationId: get_result
      tags: [read]
      summary: The full record for one result, unbounded by any list display width.
      description: "node_id is a named query parameter, not a path segment, because a node id may contain `/` -- the same as on /projects/{project}/tests/history. A node_id holding U+0000 names no result. position is the result's index in the run's stored order, its character in /runs/{run_id}/outcomes. change, was and streak say how it changed against the run's baseline, as on /runs/{run_id}/changes; all three are null when it did not change, and while the run's comparison is pending (no exit status yet) or none (no earlier complete run)."
      parameters:
        - $ref: '#/components/parameters/run_id'
        - {name: node_id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: The result., content: {application/json: {schema: {$ref: '#/components/schemas/ResultDetailResponse'}}}}
        "401": {description: "No credential -- neither Authorization: Bearer <token> nor the session cookie __Host-vantage_session -- on a server that has users; or a token that is not valid -- unknown, revoked, expired, or of a disabled user -- in the header on any server, or in the cookie on a server that has users (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope); or its user is not a member of the run's project (not_a_member). A session cookie on a request the browser marked Sec-Fetch-Site other than same-origin or none -- from another site, or another port of this host -- is refused before it is looked up (cross_site_request).", content: *rejection}
        "404": {description: "No run with that id has been recorded (unknown_run), or the run has no result with that node_id (unknown_result).", content: *rejection}
        "422": {description: "run_id is not 32 lowercase hex characters (invalid_parameter); or, once the run is found and the caller may read it, node_id missing (invalid_identity).", content: *rejection}
  /capabilities:
    get:
      operationId: capabilities
      tags: [read]
      security: []
      summary: The compatibility advertisement.
      description: A server that predates this path answers 404, which a client reads as every capability absent.
      responses:
        "200":
          description: The single advertised capability.
          content: {application/json: {schema: {type: object, required: [session_lifecycle], properties: {session_lifecycle: {type: boolean}}}}}
  /openapi.yaml:
    get:
      operationId: get_openapi_document
      tags: [read]
      security: []
      summary: This document, served as raw bytes.
      responses:
        "200": {description: The hand-written OpenAPI 3.1 YAML., content: {application/yaml: {schema: {type: string}}}}
  /runs/{run_id}/sections:
    get:
      operationId: get_run_sections
      tags: [read]
      summary: One run's section summary -- every section its project defines, plus the always-present unassigned bucket.
      description: Section definitions are read fresh on every call, never cached; classification happens at read time.
      parameters:
        - $ref: '#/components/parameters/run_id'
      responses:
        "200": {description: The run's section summary., content: {application/json: {schema: {$ref: '#/components/schemas/RunSectionSummaryResponse'}}}}
        "401": {description: "No credential -- neither Authorization: Bearer <token> nor the session cookie __Host-vantage_session -- on a server that has users; or a token that is not valid -- unknown, revoked, expired, or of a disabled user -- in the header on any server, or in the cookie on a server that has users (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope); or its user is not a member of the run's project (not_a_member). A session cookie on a request the browser marked Sec-Fetch-Site other than same-origin or none -- from another site, or another port of this host -- is refused before it is looked up (cross_site_request).", content: *rejection}
        "404": {description: No run with that id has been recorded (unknown_run)., content: *rejection}
        "422": {description: run_id is not 32 lowercase hex characters (invalid_parameter)., content: *rejection}
        "500": {description: A stored section's value could not be parsed (unreadable_setting)., content: *rejection}
  /projects:
    get:
      operationId: list_projects
      tags: [read]
      summary: The projects the caller has a role in, by name.
      description: Returned whole, not paged. An admin gets every project, with the role owner; anyone on a server with no user gets every project too, with a null role; anyone else gets default, as an editor, and each project they are a member of, with their role in it.
      responses:
        "200": {description: The projects the caller has a role in., content: {application/json: {schema: {$ref: '#/components/schemas/ProjectListResponse'}}}}
        "401": {description: "No credential -- neither Authorization: Bearer <token> nor the session cookie __Host-vantage_session -- on a server that has users; or a token that is not valid -- unknown, revoked, expired, or of a disabled user -- in the header on any server, or in the cookie on a server that has users (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope). A session cookie on a request the browser marked Sec-Fetch-Site other than same-origin or none -- from another site, or another port of this host -- is refused before it is looked up (cross_site_request).", content: *rejection}
    post:
      operationId: create_project
      tags: [write]
      summary: Add a project, as vantage project add does.
      description: A project is never renamed or deleted. It starts with no members, its maker included, since an admin acts as an owner of every project without being a member; PUT /projects/{project}/members/{user} adds them. The name is never repeated in a rejection.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectCreateRequest'}}}}
      responses:
        "201": {description: "The project, with the role its maker acts with in it: owner, or null on a server with no user.", content: {application/json: {schema: {$ref: '#/components/schemas/ProjectResponse'}}}}
        "400": {description: "The body is not UTF-8 JSON (invalid_json), or the client disconnected before sending all of it (incomplete_body).", content: *rejection}
        "401": {description: "No credential -- neither Authorization: Bearer <token> nor the session cookie __Host-vantage_session -- on a server that has users; or a token that is not valid -- unknown, revoked, expired, or of a disabled user -- in the header on any server, or in the cookie on a server that has users (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the admin scope, or its user is not an admin (insufficient_scope). A session cookie on a request the browser did not mark Sec-Fetch-Site: same-origin is refused before it is looked up (cross_site_request).", content: *rejection}
        "409": {description: "A project with that name exists already, default included (project_exists).", content: *rejection}
        "413": {description: "The body exceeds 4 KiB (payload_too_large).", content: *rejection}
        "415": {description: "Content-Type is not application/json (unsupported_media_type).", content: *rejection}
        "422": {description: "The body does not match ProjectCreateRequest (invalid_project_request); or the name is not one a project can have (invalid_project_name).", content: *rejection}
  /projects/{project}/runs:
    get:
      operationId: list_runs
      tags: [read]
      summary: Page through a project's runs, newest first.
      description: "Only the project's runs are listed, filtered and counted. metadata_key and metadata_value filter the list by key=value pairs, the n-th value pairing with the n-th key, so each is repeated once per pair -- ?metadata_key=a&metadata_value=1&metadata_key=b&metadata_value=2. A run matches when it holds every pair: a captured value exactly equal, read from a declared file or reported by the session. A run recorded before a key ever appeared has no value for it and is excluded; metadata_horizon in the response reports, for each distinct filtered key in the order first given, how many of the project's runs predate it (null when no metadata filter was given). A pair holding U+0000 matches no run; its key's horizon is that of the key with U+0000 replaced by U+FFFD, the text a report carrying it stored. Each run carries its comparison: the run it was compared with, and how many of its tests changed each way against it. A run is compared once, by the report that gives it its exit status, and never again, so the comparison is pending while the run has none -- running, or abandoned until vantage push delivers its end -- and final from then on. Its baseline is the latest complete run of its project started before it (a tie on started_at settled by id) on its own branch, or failing that, or when it has no branch, on any branch; a run is complete when it finished, was neither interrupted nor stopped early, and exited 0 or 1."
      parameters:
        - $ref: '#/components/parameters/project'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/cursor'
        - {name: metadata_key, in: query, required: false, schema: {type: array, items: {type: string}, maxItems: 16}}
