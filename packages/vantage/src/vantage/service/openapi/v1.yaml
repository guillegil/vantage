        "401": {description: "No credential -- neither Authorization: Bearer <token> nor the session cookie __Host-vantage_session -- on a server that has users; or a token that is not valid -- unknown, revoked, expired, or of a disabled user -- in the header on any server, or in the cookie on a server that has users (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the admin scope, or its user is not an admin (insufficient_scope). A session cookie on a request the browser did not mark Sec-Fetch-Site: same-origin is refused before it is looked up (cross_site_request).", content: *rejection}
        "404": {description: "No token with that id exists (unknown_token), as for a login token that expired and was deleted at its user's next login.", content: *rejection}
        "409": {description: "The server has no user yet, so no token can manage users; the vantage command adds the first (open_server).", content: *rejection}
        "422": {description: "token_id is not an integer from 1 to 9223372036854775807 (invalid_parameter).", content: *rejection}
  /login:
    post:
      operationId: log_in
      tags: [write, users]
      security: []
      summary: Trade a user's name and password for a login token, and answer it this once.
      description: "The token is in this answer only, which is not to be stored (Cache-Control: no-store). It holds the read and manage scopes, and the admin scope for a user who is an admin, never record: a report or a heartbeat takes a token vantage token create or POST /tokens made. It expires 12 hours after it was made, with no refresh, and any password set for its user revokes it sooner. Any Authorization header is ignored. Nothing counts, delays or locks out failed attempts; each costs the same deliberately slow password check. A U+0000 in the password is taken as U+FFFD, as it is where a password is set. The password is never repeated in a rejection."
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses:
        "201":
          description: The login token, shown this once, and what the server keeps of it.
          headers: {Cache-Control: {description: "no-store: the token is shown this once.", schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/CreatedTokenResponse'}}}
        "400": {description: "The body is not UTF-8 JSON (invalid_json), or the client disconnected before sending all of it (incomplete_body).", content: *rejection}
        "401": {description: "The name and password are not those of an enabled user with a password: no user has the name, or none can, the user is disabled or has no password, or the password is wrong (invalid_credentials). Every cause gets the same body and WWW-Authenticate header, after the same work.", content: *rejection}
        "409": {description: "The server has no user yet, so nobody can log in; the vantage command adds the first (open_server). Answered before the body is read.", content: *rejection}
        "413": {description: "The body exceeds 16 KiB (payload_too_large).", content: *rejection}
        "415": {description: "Content-Type is not application/json (unsupported_media_type).", content: *rejection}
        "422": {description: "The body does not match LoginRequest -- a field missing, of the wrong type or unknown (invalid_login_request).", content: *rejection}
        "503": {description: "As many requests are checking or setting a password as the server lets wait -- two hashing and 32 waiting -- so this one is refused at once (password_checks_busy), with Retry-After: 1.", content: *rejection}
  /password:
    post:
      operationId: change_password
      tags: [write, users]
      security: []
      summary: Change a user's password, given the current one.
      description: "The current password is the credential, so no token is needed, and any Authorization header is ignored. The new password is checked against the rule before the current one is checked. Every login token of the user is revoked, so they log in again; the tokens vantage token create or POST /tokens made are left alone. Of two changes made at once, one wins and the other answers 401. A U+0000 in either password is taken as U+FFFD, as it is at login. Neither password is ever repeated in a rejection."
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordChangeRequest'}}}}
      responses:
        "204": {description: Changed.}
        "400": {description: "The body is not UTF-8 JSON (invalid_json), or the client disconnected before sending all of it (incomplete_body).", content: *rejection}
        "401": {description: "The name and password are not those of an enabled user with a password, as for /login, or another change of the password won while this one was checked (invalid_credentials). Every cause gets the same body and WWW-Authenticate header.", content: *rejection}
        "409": {description: "The server has no user yet, so nobody has a password to change; the vantage command adds the first (open_server). Answered before the body is read.", content: *rejection}
        "413": {description: "The body exceeds 16 KiB (payload_too_large).", content: *rejection}
        "415": {description: "Content-Type is not application/json (unsupported_media_type).", content: *rejection}
        "422": {description: "The body does not match PasswordChangeRequest -- a field missing, of the wrong type or unknown (invalid_password_request); or new_password is not 15 to 256 characters once NFKC-normalised, or holds a control character other than U+0000, or a lone surrogate (invalid_password); fields is [new_password].", content: *rejection}
        "503": {description: "As many requests are checking or setting a password as the server lets wait -- two hashing and 32 waiting -- so this one is refused at once (password_checks_busy), with Retry-After: 1.", content: *rejection}
  /session:
    post:
      operationId: sign_in
      tags: [write, users]
      security: []
      summary: Sign a browser in with a user's name and password, for a session cookie.
      description: "Checked as /login checks it, in the same order, for the same login token: read and manage, and admin for a user who is an admin, never record, expiring 12 hours after it was made, and revoked sooner by DELETE /session or by any password set for its user. The token is in the Set-Cookie header alone, never in the body, and page script cannot read it. Browsers keep the cookie only over HTTPS or on a loopback address. The browser must mark the request Sec-Fetch-Site: same-origin, whether or not it carries a cookie, so no other site or port of the same host can sign it in as someone else. Any Authorization header and any cookie are ignored."
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses:
        "201":
          description: Signed in. The body names the user and when the session ends, never the token.
          headers:
            Set-Cookie: {description: "__Host-vantage_session=<login token>; HttpOnly; Max-Age=43200; Path=/; SameSite=strict; Secure -- the login token, living as long as it does.", schema: {type: string}}
            Cache-Control: {description: "no-store.", schema: {type: string}}
          content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}
        "400": {description: "The body is not UTF-8 JSON (invalid_json), or the client disconnected before sending all of it (incomplete_body).", content: *rejection}
        "401": {description: "The name and password are not those of an enabled user with a password, as for /login (invalid_credentials). Every cause gets the same body and WWW-Authenticate header, after the same work, and no cookie.", content: *rejection}
        "403": {description: "The browser did not mark the request Sec-Fetch-Site: same-origin (cross_site_request). Answered before the body is read.", content: *rejection}
        "409": {description: "The server has no user yet, so nobody can sign in; the vantage command adds the first (open_server). Answered before the body is read.", content: *rejection}
        "413": {description: "The body exceeds 16 KiB (payload_too_large).", content: *rejection}
        "415": {description: "Content-Type is not application/json (unsupported_media_type).", content: *rejection}
        "422": {description: "The body does not match LoginRequest -- a field missing, of the wrong type or unknown (invalid_login_request).", content: *rejection}
        "503": {description: "As many requests are checking or setting a password as the server lets wait -- two hashing and 32 waiting -- so this one is refused at once (password_checks_busy), with Retry-After: 1.", content: *rejection}
    get:
      operationId: get_session
      tags: [read]
      summary: Who the caller is, and when their session ends.
      description: "Answers for any credential another path takes, the session cookie or a token in the Authorization header: the user's name, whether they are an admin now, and when the token stops authenticating -- 12 hours after a login, never for a token vantage token create or POST /tokens made. A server with no user answers open, with no user. A server with users asked with no credential answers 401, which is how a browser client learns to sign in."
      responses:
        "200": {description: The caller., content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}}
        "401": {description: "No credential -- neither Authorization: Bearer <token> nor the session cookie __Host-vantage_session -- on a server that has users; or a token that is not valid -- unknown, revoked, expired, or of a disabled user -- in the header on any server, or in the cookie on a server that has users (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope). A session cookie on a request the browser marked Sec-Fetch-Site other than same-origin or none -- from another site, or another port of this host -- is refused before it is looked up (cross_site_request).", content: *rejection}
    delete:
      operationId: sign_out
      tags: [write]
      security: []
      summary: Sign a browser out.
      description: "Revokes the token the session cookie holds, if it still authenticates, and clears the cookie. A cookie that is absent, malformed, expired or revoked is cleared alike, on any server, a server with no user included. The Authorization header is never read: POST /tokens/{token_id}/revoke revokes a token sent that way."
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie: {description: "__Host-vantage_session=\"\"; HttpOnly; Max-Age=0; Path=/; SameSite=strict; Secure -- the cookie cleared.", schema: {type: string}}
        "403": {description: "The browser did not mark the request Sec-Fetch-Site: same-origin (cross_site_request). Nothing is revoked or cleared.", content: *rejection}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, description: "A token `vantage token create` printed, or the admin API or /login returned. Each holds one or more of the read, record, manage and admin scopes; one /login returned expires 12 hours after it was made."}
    session: {type: apiKey, in: cookie, name: __Host-vantage_session, description: "The login token POST /session set in a browser, HttpOnly, Secure and SameSite=Strict. Read only when no Authorization header is sent, never on a server with no user, and only on a request the browser marks Sec-Fetch-Site: same-origin -- or, for a GET, none or not at all."}
  parameters:
    run_id: {name: run_id, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{32}$'}}
    # No `maximum`. A caller asking for more than 200 gets 200, not a
    # rejection -- someone requesting a large page wants data, not an
    # error. `maximum: 200` would assert a constraint the server does not
    # enforce, and a strict generated client would refuse a request the
    # server answers happily. The cap is stated as behaviour instead.
    limit: {name: limit, in: query, required: false, description: "Page size. Values above 200 are clamped to 200; the response reports whether more items exist. A value below 1 is rejected with 422 -- it is not a page size.", schema: {type: integer, minimum: 1}}
    offset: {name: offset, in: query, required: false, schema: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}}
    project: {name: project, in: path, required: true, description: "A project's name; one no project can have answers 404.", schema: {type: string}}
    user_name: {name: name, in: path, required: true, description: "A user's name; one no user can have answers 404.", schema: {type: string}}
    member_user: {name: user, in: path, required: true, description: "A user's name; one no user can have answers 404.", schema: {type: string}}
    token_user: {name: user, in: query, required: false, description: "Only this user's tokens; a name nobody has lists none.", schema: {type: string}}
    token_id: {name: token_id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}}
    cursor: {name: cursor, in: query, required: false, description: "The next_cursor a previous page of the same list returned. The page starts just past the last run that page listed, so runs recorded in between never repeat or shift a run onto it, as they do under an offset. Opaque: pass it back unchanged. Not combined with a non-zero offset.", schema: {type: string, maxLength: 128}}
  schemas:
    # Request and response bodies are both stated in full: this document is
    # the contract for what the server accepts and what it returns, and a
    # `type: object` stub would leave a generated client guessing.
    #
    # That duplicates the Pydantic models -- `ingestion/schemas.py` for the
    # report, `service/schemas.py` for the rest -- and the schema checks at
    # the end of `test_interface_document.py` bound the duplication. They
    # parse this file and read `model_fields` independently -- neither side is
    # generated from the other -- and compare, in both directions:
    #
    #   * which schemas are declared, against the models bound to them, and
    #     that every model reachable from a bound one is bound too;
    #   * each schema's property names, against its model's field names;
    #   * each schema's `required` list (what the client must send on a
    #     request, what it can rely on receiving in a response);
    #   * whether each property admits `null`, against whether the field's
    #     annotation admits `None`;
    #   * each `$ref`, against the model the field actually holds;
    #   * `additionalProperties`, against the model's `extra` setting;
    #   * every declared `enum`, against `OUTCOMES` / `PRESENTATIONS`, the
    #     metadata vocabularies, `SCOPES` and `ROLES` -- the domain frozensets
    #     that decide what the server can emit;
    #   * which properties are passwords, `format: password` and `writeOnly`,
    #     against the request fields a model keeps out of its `repr`.
    #
    # Not checked here: the JSON `type` keyword, any other `format`,
    # `default`, and the `pattern` / `maxLength` constraints. A `string`
    # declared where the model holds an `int` would drift silently. The
    # integer `minimum` / `maximum` bounds are checked against the running
    # server instead.
    SessionReport:
      type: object
      required: [run]
      properties: {run: {$ref: '#/components/schemas/RunReport'}, results: {type: [array, "null"], items: {$ref: '#/components/schemas/ResultReport'}}, vcs: {oneOf: [{$ref: '#/components/schemas/VcsReport'}, {type: "null"}]}, metadata: {oneOf: [{$ref: '#/components/schemas/MetadataReport'}, {type: "null"}]}, project: {type: [string, "null"], pattern: '^[a-z0-9][a-z0-9._-]{0,63}$', description: "The run's project, which must exist; absent or null, default. A sibling of run rather than a field of it, so no server refuses a report for carrying it."}}
    RunReport:
      type: object
      required: [id, started_at, finished_at, exit_status, interrupted, interrupt_reason]
      additionalProperties: false
      properties: {id: {type: string, pattern: '^[0-9a-f]{32}$'}, started_at: {type: string, format: date-time}, finished_at: {type: [string, "null"], format: date-time}, exit_status: {type: [integer, "null"], format: int64, minimum: -9223372036854775808, maximum: 9223372036854775807}, interrupted: {type: boolean}, interrupt_reason: {type: [string, "null"]}}
    # An unknown key on one result is tolerated and named back in
    # `Acknowledgement.ignored`; the failure and captured-output fields are
    # optional, because an older plugin sends none of them.
    ResultReport:
      type: object
      required: [node_id, file_path, class_name, function_name, param_id, outcome, duration, started_at, finished_at, setup_outcome, call_outcome, teardown_outcome, setup_duration, call_duration, teardown_duration, worker_id]
      additionalProperties: true
      properties: {node_id: {type: string}, file_path: {type: string}, class_name: {type: [string, "null"]}, function_name: {type: string}, param_id: {type: [string, "null"]}, outcome: {type: string, enum: [passed, failed, error, skipped, xfailed, xpassed]}, duration: {type: [number, "null"]}, started_at: {type: [string, "null"], format: date-time}, finished_at: {type: [string, "null"], format: date-time}, setup_outcome: {type: [string, "null"], enum: [passed, failed, error, skipped, xfailed, xpassed, null]}, call_outcome: {type: [string, "null"], enum: [passed, failed, error, skipped, xfailed, xpassed, null]}, teardown_outcome: {type: [string, "null"], enum: [passed, failed, error, skipped, xfailed, xpassed, null]}, setup_duration: {type: [number, "null"]}, call_duration: {type: [number, "null"]}, teardown_duration: {type: [number, "null"]}, worker_id: {type: [string, "null"]}, failure_type: {type: [string, "null"], default: null}, failure_message: {type: [string, "null"], default: null}, failure_message_truncated: {type: boolean, default: false}, failure_path: {type: [string, "null"], default: null}, failure_lineno: {type: [integer, "null"], format: int64, minimum: -9223372036854775808, maximum: 9223372036854775807, default: null}, failure_repr: {type: [string, "null"], default: null}, failure_repr_truncated: {type: boolean, default: false}, traceback: {type: [string, "null"], default: null}, traceback_truncated: {type: boolean, default: false}, skip_reason: {type: [string, "null"], default: null}, skip_reason_truncated: {type: boolean, default: false}, xfail_reason: {type: [string, "null"], default: null}, xfail_reason_truncated: {type: boolean, default: false}, captured_stdout: {type: [string, "null"], default: null}, captured_stdout_truncated: {type: boolean, default: false}, captured_stderr: {type: [string, "null"], default: null}, captured_stderr_truncated: {type: boolean, default: false}}
    VcsReport:
      type: object
      required: [commit, branch, commit_subject, dirty, root]
      additionalProperties: false
      properties: {commit: {type: [string, "null"], maxLength: 64}, branch: {type: [string, "null"]}, commit_subject: {type: [string, "null"]}, dirty: {type: [boolean, "null"]}, root: {type: [string, "null"]}}
    # `declaration` is null when the session had no declaration file. `keys`
    # maps a declared key to what the declaration says about it; `values` are
    # the keys the session reported itself, and only a session's last report
    # carries them.
    MetadataReport:
      type: object
      required: [declaration]
      additionalProperties: false
      properties: {declaration: {type: [string, "null"]}, keys: {type: object, additionalProperties: {$ref: '#/components/schemas/MetadataKeyReport'}, default: {}}, files: {type: array, items: {$ref: '#/components/schemas/MetadataFileReport'}, default: []}, values: {type: array, items: {$ref: '#/components/schemas/MetadataValueReport'}, default: []}}
    # A name over 256 characters is stored as no name; the key is kept.
    MetadataKeyReport:
      type: object
      additionalProperties: false
      properties: {name: {type: [string, "null"], default: null}}
    # No constraint on any field, as for a file. `status` is captured, absent
    # or value_too_large, and `value` is null unless it is captured: an entry
    # with any other status is dropped, and one whose value contradicts its
    # status is stored as absent. A key a file already gave, or an earlier
    # entry, keeps that value.
    MetadataValueReport:
      type: object
      required: [key, value, status]
      additionalProperties: false
      properties: {key: {type: string}, value: {type: [string, "null"]}, status: {type: string}}
    # No constraint on any field: a declared value is text this project does
    # not control, so the server drops what it cannot store rather than
    # rejecting the report. `content` is null unless `status` is `captured`.
    MetadataFileReport:
      type: object
      required: [path, format, status, keys, content]
      additionalProperties: false
      properties: {path: {type: string}, format: {type: string}, status: {type: string}, keys: {type: array, items: {type: string}}, content: {type: [string, "null"]}}
    # The one body every rejection has. `detail` is a fixed sentence and
    # `fields` holds dotted field paths; neither ever repeats a submitted
    # value.
    Rejection:
      type: object
      required: [error, detail, fields]
      properties: {error: {type: string}, detail: {type: string}, fields: {type: array, items: {type: string}}}
    Acknowledgement:
      type: object
      required: [run_id, status, ignored]
      properties: {run_id: {type: string}, status: {type: string}, ignored: {type: array, items: {type: string}}}
    HeartbeatAcknowledgement:
      type: object
      required: [run_id, status]
      properties: {run_id: {type: string}, status: {type: string}}
    # No `root`. `VcsContext` carries one; this model has no field to
    # populate, which is what keeps a reporter's absolute path off the wire
    # on the detail path where no type stops it.
    RunVcs:
      type: object
      required: [commit, branch, commit_subject, commit_subject_truncated, dirty]
      properties: {commit: {type: [string, "null"]}, branch: {type: [string, "null"]}, commit_subject: {type: [string, "null"]}, commit_subject_truncated: {type: boolean}, dirty: {type: [boolean, "null"]}}
    # Every outcome is present, zeros included. A running run's counts may
    # include results stored after its page was read; a finished run's are
    # final.
    OutcomeCounts:
      type: object
      required: [passed, failed, error, skipped, xfailed, xpassed]
      properties: {passed: {type: integer}, failed: {type: integer}, error: {type: integer}, skipped: {type: integer}, xfailed: {type: integer}, xpassed: {type: integer}}
    # The run another was compared with.
    Baseline:
      type: object
      required: [id, started_at, branch]
      properties: {id: {type: string, pattern: '^[0-9a-f]{32}$'}, started_at: {type: string, format: date-time}, branch: {type: [string, "null"]}}
    # Every change is present, zeros included. One of removed and
    # not_reached is always 0: a run's missing tests are all one or all the
    # other.
    ChangeCounts:
      type: object
      required: [new_failure, still_failing, fixed, new_test, removed, not_reached]
      properties: {new_failure: {type: integer}, still_failing: {type: integer}, fixed: {type: integer}, new_test: {type: integer}, removed: {type: integer}, not_reached: {type: integer}}
    # baseline and counts are non-null exactly for branch and project.
    Comparison:
      type: object
      required: [state, baseline, counts]
      properties: {state: {type: string, enum: [pending, none, branch, project], description: "pending: the run has no exit status yet, and is compared when it gets one. none: no earlier run of its project was complete. branch: its baseline is the latest complete run of its own branch. project: its baseline is the project's latest complete run, because it has no branch or no earlier run of its branch is complete."}, baseline: {oneOf: [{$ref: '#/components/schemas/Baseline'}, {type: "null"}]}, counts: {oneOf: [{$ref: '#/components/schemas/ChangeCounts'}, {type: "null"}], description: "How many tests changed each way against the baseline: new_failure, a test failing (failed or error) that passed, was skipped, xfailed or xpassed there, or that it lacked; still_failing, failing in both; fixed, failing there and not here; new_test, not failing and absent there; removed, a test there the run lacks, when the run ran to its end (exit 0, 1 or 5); not_reached, the same when it did not."}}
    RunListItem:
      type: object
      required: [id, started_at, finished_at, exit_status, interrupted, presentation, vcs, recorded_by, counts, comparison]
      properties: {id: {type: string, pattern: '^[0-9a-f]{32}$'}, started_at: {type: string, format: date-time}, finished_at: {type: [string, "null"], format: date-time}, exit_status: {type: [integer, "null"]}, interrupted: {type: boolean}, presentation: {type: string, enum: [running, finished, interrupted, abandoned]}, vcs: {oneOf: [{$ref: '#/components/schemas/RunVcs'}, {type: "null"}]}, recorded_by: {type: [string, "null"], description: "The user whose token created the run; null for one recorded without a token."}, counts: {$ref: '#/components/schemas/OutcomeCounts'}, comparison: {$ref: '#/components/schemas/Comparison'}}
    # One per distinct filtered key, in the order first given. `predating`
    # equals the total run count when no run ever carried `key`.
    MetadataHorizon:
      type: object
      required: [key, predating]
      properties: {key: {type: string}, predating: {type: integer}}
    RunListResponse:
      type: object
      required: [items, has_more, next_cursor, metadata_horizon]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/RunListItem'}}, has_more: {type: boolean}, next_cursor: {type: [string, "null"], description: "The cursor for the page after this one; null on the last page."}, metadata_horizon: {type: [array, "null"], items: {$ref: '#/components/schemas/MetadataHorizon'}}}
    # Carries `interrupt_reason` and an untruncated `commit_subject`, which
    # the lean list entry omits -- the detail path keeps the full record
    # reachable.
    RunDetailResponse:
      type: object
      required: [id, started_at, finished_at, exit_status, interrupted, interrupt_reason, presentation, vcs, recorded_by, project, counts, comparison]
      properties: {id: {type: string, pattern: '^[0-9a-f]{32}$'}, started_at: {type: string, format: date-time}, finished_at: {type: [string, "null"], format: date-time}, exit_status: {type: [integer, "null"]}, interrupted: {type: boolean}, interrupt_reason: {type: [string, "null"]}, presentation: {type: string, enum: [running, finished, interrupted, abandoned]}, vcs: {oneOf: [{$ref: '#/components/schemas/RunVcs'}, {type: "null"}]}, recorded_by: {type: [string, "null"], description: "The user whose token created the run; null for one recorded without a token."}, project: {type: string, description: "The project the run was created in."}, counts: {$ref: '#/components/schemas/OutcomeCounts'}, comparison: {$ref: '#/components/schemas/Comparison'}}
    # One character per result, in stored order: . F E s x X for passed,
    # failed, error, skipped, xfailed and xpassed; changes, when not null,
    # is as long, - n s f t for unchanged, new_failure, still_failing, fixed
    # and new_test.
    RunOutcomesResponse:
      type: object
      required: [outcomes, changes]
      properties: {outcomes: {type: string, pattern: '^[.FEsxX]*$'}, changes: {type: [string, "null"], pattern: '^[-nsft]*$'}}
    # `source_file` names the declared file of a `file` key and is null for a
    # `session` one; `value` is null unless `status` is `captured`; `name`
    # is the display name the run's declaration gave the key.
    MetadataItem:
      type: object
      required: [key, name, value, status, source, source_file, declared]
      properties: {key: {type: string}, name: {type: [string, "null"]}, value: {type: [string, "null"]}, status: {type: string, enum: [captured, absent, not_scalar, value_too_large, source_unavailable]}, source: {type: string, enum: [file, session]}, source_file: {type: [string, "null"]}, declared: {type: boolean}}
    MetadataFile:
      type: object
      required: [source_file, content_type, status]
      properties: {source_file: {type: string}, content_type: {type: string, enum: [json, yaml]}, status: {type: string, enum: [captured, not_found, path_rejected, too_large, not_text, unreadable, over_budget, malformed]}}
    RunMetadataResponse:
      type: object
      required: [items, files]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/MetadataItem'}}, files: {type: array, items: {$ref: '#/components/schemas/MetadataFile'}}}
    # No traceback, failure_repr or captured output at any depth -- a
    # results list never carries them; the single-result endpoint does.
    FailureProjection:
      type: object
      required: [failure_type, failure_message, failure_message_truncated, failure_path, failure_lineno, skip_reason, xfail_reason]
      properties: {failure_type: {type: [string, "null"]}, failure_message: {type: [string, "null"]}, failure_message_truncated: {type: boolean}, failure_path: {type: [string, "null"]}, failure_lineno: {type: [integer, "null"]}, skip_reason: {type: [string, "null"]}, xfail_reason: {type: [string, "null"]}}
    ResultListItem:
      type: object
      required: [node_id, file_path, class_name, function_name, param_id, outcome, duration, started_at, finished_at, setup_outcome, call_outcome, teardown_outcome, setup_duration, call_duration, teardown_duration, worker_id, failure]
      properties: {node_id: {type: string}, file_path: {type: string}, class_name: {type: [string, "null"]}, function_name: {type: string}, param_id: {type: [string, "null"]}, outcome: {type: string, enum: [passed, failed, error, skipped, xfailed, xpassed]}, duration: {type: [number, "null"]}, started_at: {type: [string, "null"], format: date-time}, finished_at: {type: [string, "null"], format: date-time}, setup_outcome: {type: [string, "null"]}, call_outcome: {type: [string, "null"]}, teardown_outcome: {type: [string, "null"]}, setup_duration: {type: [number, "null"]}, call_duration: {type: [number, "null"]}, teardown_duration: {type: [number, "null"]}, worker_id: {type: [string, "null"]}, failure: {oneOf: [{$ref: '#/components/schemas/FailureProjection'}, {type: "null"}]}}
    # How many consecutive runs failed a still-failing test along its run's
    # chain of baselines, the run itself included, and the first of them.
    Streak:
      type: object
      required: [runs, since]
      properties: {runs: {type: integer, minimum: 2}, since: {type: string, pattern: '^[0-9a-f]{32}$'}}
    # outcome, duration and position are null for removed and not_reached,
    # a test the run lacks; was is null when the baseline lacks the test;
    # streak is non-null exactly for still_failing.
    ChangeItem:
      type: object
      required: [node_id, file_path, class_name, function_name, param_id, change, outcome, was, duration, position, streak]
      properties: {node_id: {type: string}, file_path: {type: string}, class_name: {type: [string, "null"]}, function_name: {type: string}, param_id: {type: [string, "null"]}, change: {type: string, enum: [new_failure, still_failing, fixed, new_test, removed, not_reached], description: "new_failure: failing (failed or error) here, and not failing or absent in the baseline. still_failing: failing in both. fixed: failing there and not here. new_test: not failing here and absent there. removed: in the baseline and not in this run, which ran to its end (exit 0, 1 or 5). not_reached: the same, in a run that did not."}, outcome: {type: [string, "null"], enum: [passed, failed, error, skipped, xfailed, xpassed, null]}, was: {type: [string, "null"], enum: [passed, failed, error, skipped, xfailed, xpassed, null], description: "The test's outcome in the baseline."}, duration: {type: [number, "null"]}, position: {type: [integer, "null"], description: "The result's index in the run's stored order, its character in /runs/{run_id}/outcomes."}, streak: {oneOf: [{$ref: '#/components/schemas/Streak'}, {type: "null"}]}}
    ChangesResponse:
      type: object
      required: [items, has_more]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/ChangeItem'}}, has_more: {type: boolean}}
    ResultsResponse:
      type: object
      required: [items, has_more]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/ResultListItem'}}, has_more: {type: boolean}}
    # The single-result endpoint's response -- every field a list response
    # bounds or excludes, unbounded, flat like `ResultReport`'s own wire
    # shape rather than nesting `failure`/`captured`.
    ResultDetailResponse:
      type: object
      required: [node_id, file_path, class_name, function_name, param_id, outcome, duration, started_at, finished_at, setup_outcome, call_outcome, teardown_outcome, setup_duration, call_duration, teardown_duration, worker_id, failure_type, failure_message, failure_message_truncated, failure_path, failure_lineno, failure_repr, failure_repr_truncated, traceback, traceback_truncated, skip_reason, skip_reason_truncated, xfail_reason, xfail_reason_truncated, captured_stdout, captured_stdout_truncated, captured_stderr, captured_stderr_truncated, position, change, was, streak]
      properties: {node_id: {type: string}, file_path: {type: string}, class_name: {type: [string, "null"]}, function_name: {type: string}, param_id: {type: [string, "null"]}, outcome: {type: string, enum: [passed, failed, error, skipped, xfailed, xpassed]}, duration: {type: [number, "null"]}, started_at: {type: [string, "null"], format: date-time}, finished_at: {type: [string, "null"], format: date-time}, setup_outcome: {type: [string, "null"]}, call_outcome: {type: [string, "null"]}, teardown_outcome: {type: [string, "null"]}, setup_duration: {type: [number, "null"]}, call_duration: {type: [number, "null"]}, teardown_duration: {type: [number, "null"]}, worker_id: {type: [string, "null"]}, failure_type: {type: [string, "null"]}, failure_message: {type: [string, "null"]}, failure_message_truncated: {type: boolean}, failure_path: {type: [string, "null"]}, failure_lineno: {type: [integer, "null"]}, failure_repr: {type: [string, "null"]}, failure_repr_truncated: {type: boolean}, traceback: {type: [string, "null"]}, traceback_truncated: {type: boolean}, skip_reason: {type: [string, "null"]}, skip_reason_truncated: {type: boolean}, xfail_reason: {type: [string, "null"]}, xfail_reason_truncated: {type: boolean}, captured_stdout: {type: [string, "null"]}, captured_stdout_truncated: {type: boolean}, captured_stderr: {type: [string, "null"]}, captured_stderr_truncated: {type: boolean}, position: {type: integer, minimum: 0}, change: {type: [string, "null"], enum: [new_failure, still_failing, fixed, new_test, null]}, was: {type: [string, "null"], enum: [passed, failed, error, skipped, xfailed, xpassed, null]}, streak: {oneOf: [{$ref: '#/components/schemas/Streak'}, {type: "null"}]}}
    HistoryEntry:
      type: object
      required: [run_id, started_at, finished_at, outcome, duration, vcs, change]
      properties: {run_id: {type: string, pattern: '^[0-9a-f]{32}$'}, started_at: {type: string, format: date-time}, finished_at: {type: [string, "null"], format: date-time}, outcome: {type: string, enum: [passed, failed, error, skipped, xfailed, xpassed]}, duration: {type: [number, "null"]}, vcs: {oneOf: [{$ref: '#/components/schemas/RunVcs'}, {type: "null"}]}, change: {type: [string, "null"], enum: [new_failure, still_failing, fixed, new_test, null]}}
    HistoryResponse:
      type: object
      required: [items, has_more, next_cursor]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/HistoryEntry'}}, has_more: {type: boolean}, next_cursor: {type: [string, "null"], description: "The cursor for the page after this one; null on the last page."}}
    SectionUpsertRequest:
      type: object
      required: [name, prefix]
      properties: {name: {type: string}, prefix: {type: string}}
    SectionResponse:
      type: object
      required: [name, prefix]
      properties: {name: {type: string}, prefix: {type: string}}
    SectionListResponse:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/SectionResponse'}}}
    SectionSummary:
      type: object
      required: [name, total, measured, passing, pass_percentage]
      properties: {name: {type: string}, total: {type: integer}, measured: {type: integer}, passing: {type: integer}, pass_percentage: {type: [number, "null"]}}
    RunSectionSummaryResponse:
      type: object
      required: [items, unassigned]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/SectionSummary'}}, unassigned: {$ref: '#/components/schemas/SectionSummary'}}
    # Users and tokens. The request bodies refuse an unknown field, and take
    # a boolean only as a JSON boolean. A token is in CreatedTokenResponse
    # alone; no other body carries it, or its digest. A password is in the
    # password request bodies alone; no body carries one back, or its hash.
    UserCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties: {name: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}, admin: {type: boolean, default: false}}
    UserUpdateRequest:
      type: object
      description: At least one of admin and disabled must be given and not null.
      additionalProperties: false
      properties: {admin: {type: [boolean, "null"], default: null}, disabled: {type: [boolean, "null"], default: null}}
    TokenCreateRequest:
      type: object
      required: [user]
      additionalProperties: false
      properties: {user: {type: string}, scopes: {type: array, items: {type: string, enum: [admin, manage, read, record]}, minItems: 1, default: [read, record]}, label: {type: string, maxLength: 200, default: ""}}
    UserResponse:
      type: object
      required: [name, admin, disabled, created_at, has_password]
      properties: {name: {type: string}, admin: {type: boolean}, disabled: {type: boolean}, created_at: {type: string, format: date-time}, has_password: {type: boolean, description: "Whether the user has a password, and so can log in while enabled."}}
    UserListResponse:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/UserResponse'}}}
    TokenResponse:
      type: object
      required: [id, user, label, scopes, created_at, revoked_at, expires_at]
      properties: {id: {type: integer, format: int64}, user: {type: string}, label: {type: string}, scopes: {type: array, items: {type: string, enum: [admin, manage, read, record]}}, created_at: {type: string, format: date-time}, revoked_at: {type: [string, "null"], format: date-time}, expires_at: {type: [string, "null"], format: date-time, description: "When a login token stops authenticating; null for a token vantage token create or POST /tokens made, which never expires."}}
    TokenListResponse:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/TokenResponse'}}}
    CreatedTokenResponse:
      type: object
      required: [token, id, user, label, scopes, created_at, revoked_at, expires_at]
      properties: {token: {type: string, description: "The token, shown this once."}, id: {type: integer, format: int64}, user: {type: string}, label: {type: string}, scopes: {type: array, items: {type: string, enum: [admin, manage, read, record]}}, created_at: {type: string, format: date-time}, revoked_at: {type: [string, "null"], format: date-time}, expires_at: {type: [string, "null"], format: date-time, description: "When a login token stops authenticating; null for a token vantage token create or POST /tokens made, which never expires."}}
    # Passwords. The rule a password to set follows is stated, not declared
    # as `minLength` / `maxLength`, which count characters before
    # normalising, so a strict client would refuse a password the server
    # takes. Spaces count and nothing is trimmed. A password to check is not
    # held to the rule, so a later rule locks nobody out.
    LoginRequest:
      type: object
      required: [name, password]
      additionalProperties: false
      properties: {name: {type: string}, password: {type: string, format: password, writeOnly: true}}
    PasswordChangeRequest:
      type: object
      required: [name, password, new_password]
      additionalProperties: false
      properties: {name: {type: string}, password: {type: string, format: password, writeOnly: true, description: "The current password."}, new_password: {type: string, format: password, writeOnly: true, description: "The password to set: 15 to 256 characters once NFKC-normalised, none of them a control character or a lone surrogate."}}
    PasswordSetRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties: {password: {type: string, format: password, writeOnly: true, description: "The password to set: 15 to 256 characters once NFKC-normalised, none of them a control character or a lone surrogate."}}
    # A browser session. The token is never in it: POST /session puts it in
    # a cookie page script cannot read.
    SessionUserResponse:
      type: object
      required: [name, admin]
      properties: {name: {type: string}, admin: {type: boolean, description: "Whether this credential may use the admin routes now: its token holds the admin scope and its user is an admin."}}
    SessionResponse:
      type: object
      required: [open, user, expires_at]
      properties: {open: {type: boolean, description: "Whether the server has no user, and so serves anyone without signing in."}, user: {oneOf: [{$ref: '#/components/schemas/SessionUserResponse'}, {type: "null"}], description: "Who the caller is; null on a server with no user."}, expires_at: {type: [string, "null"], format: date-time, description: "When the caller's token stops authenticating: set for a login token, the session cookie's included; null for a token vantage token create or POST /tokens made, and on a server with no user."}}
    # Projects. A project is never renamed or deleted; its name follows the
    # user-name rule.
    ProjectCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties: {name: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}}
    ProjectResponse:
      type: object
      required: [name, created_at, role]
      properties: {name: {type: string}, created_at: {type: string, format: date-time}, role: {type: [string, "null"], enum: [editor, owner, viewer, null], description: "The role the caller acts with in the project: owner for an admin, editor in default, otherwise their member row's; null on a server with no user, which checks no role."}}
    ProjectListResponse:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/ProjectResponse'}}}
    # Members. A role is viewer, editor or owner, each allowed what the ones
    # before it are. default takes none: every user is an editor of it,
    # which `everyone` says. The request body refuses an unknown field, and
    # takes the role only as a JSON string.
    MemberSetRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties: {role: {type: string, enum: [editor, owner, viewer]}}
    MemberResponse:
      type: object
      required: [user, role]
      properties: {user: {type: string}, role: {type: string, enum: [editor, owner, viewer]}}
    MemberListResponse:
      type: object
      required: [items, everyone]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/MemberResponse'}}, everyone: {type: [string, "null"], enum: [editor, owner, viewer, null], description: "The role every user holds in the project without being a member: editor in default, null elsewhere."}}
