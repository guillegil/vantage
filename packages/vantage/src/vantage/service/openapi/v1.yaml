        "403": {description: "The token does not grant the manage scope (insufficient_scope); or its user is not a member of the project (not_a_member), or their role in it is below owner (insufficient_role), as every user's but an admin's is in default. A session cookie on a request the browser did not mark Sec-Fetch-Site: same-origin is refused before it is looked up (cross_site_request).", content: *rejection}
        "404": {description: "No project with that name exists, or none can (unknown_project); or the user is not a member of the project, whether or not a user of that name exists or can (unknown_member).", content: *rejection}
        "409": {description: "The server has no user yet, so nobody is a member of anything; the vantage command adds the first (open_server); or the project is default, which has no members, since every user is an editor of it (default_project).", content: *rejection}
