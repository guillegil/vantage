        - $ref: '#/components/parameters/project'
        - $ref: '#/components/parameters/member_user'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemberSetRequest'}}}}
      responses:
        "201": {description: Added, a new member., content: {application/json: {schema: {$ref: '#/components/schemas/MemberResponse'}}}}
        "200": {description: The role set; the user was a member already., content: {application/json: {schema: {$ref: '#/components/schemas/MemberResponse'}}}}
        "400": {description: "The body is not UTF-8 JSON (invalid_json), or the client disconnected before sending all of it (incomplete_body).", content: *rejection}
        "401": {description: "No credential -- neither Authorization: Bearer <token> nor the session cookie __Host-vantage_session -- on a server that has users; or a token that is not valid -- unknown, revoked, expired, or of a disabled user -- in the header on any server, or in the cookie on a server that has users (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the manage scope (insufficient_scope); or its user is not a member of the project (not_a_member), or their role in it is below owner (insufficient_role), as every user's but an admin's is in default. A session cookie on a request the browser did not mark Sec-Fetch-Site: same-origin is refused before it is looked up (cross_site_request).", content: *rejection}
        "404": {description: "No project with that name exists, or none can (unknown_project); or no user with that name exists, or none can (unknown_user).", content: *rejection}
        "409": {description: "The server has no user yet, so nobody is a member of anything; the vantage command adds the first (open_server); or the project is default, which has no members, since every user is an editor of it (default_project).", content: *rejection}
        "413": {description: "The body exceeds 4 KiB (payload_too_large).", content: *rejection}
        "415": {description: "Content-Type is not application/json (unsupported_media_type).", content: *rejection}
        "422": {description: "The body does not match MemberSetRequest -- a field missing, of the wrong type or unknown (invalid_member_request); or the role is not viewer, editor or owner (invalid_role), fields is [role].", content: *rejection}
