# Hand-written, never generated from `app.routes`. A generated document
# would be the code in another format and could never fail the drift check
# `test_interface_document.py` runs against it.
openapi: 3.1.0
info:
  title: Vantage API
  version: "1"
  description: "read-tagged paths are guaranteed to leave stored data unchanged; write-tagged paths change stored data. Every rejection -- each 4xx and 5xx listed here, and the 404 or 405 for a path nothing serves or a method a path does not take -- has the Rejection body. A server whose database has no user serves every path without a token but the users-tagged ones, which answer 409 open_server until the vantage command adds the first user. Once a user exists, every path but /capabilities and /openapi.yaml needs Authorization: Bearer <token>, a token of an enabled user that has not been revoked and grants the path's scope: read for what read-tagged paths return, record for a report or a heartbeat, admin for changing sections and for the users-tagged paths -- the admin scope granting nothing once its user is no longer an admin. A 401 or 403 carries a WWW-Authenticate header naming the scope a request lacked."
servers:
  - url: /api/v1
security:
  - bearer: []
  - {}
tags:
  - {name: read, description: Leaves stored data unchanged.}
  - {name: write, description: Changes stored data.}
  - {name: users, description: "Users and their tokens. Needs a token granting the admin scope on every server: one with no user answers 409 open_server."}
paths:
  /runs:
    post:
      operationId: create_run
      tags: [write]
      summary: Report a session's run and its results.
      description: Every U+0000, and every lone surrogate, in a key or string value of the body is stored as U+FFFD, and so is every U+0000 a declared metadata document escapes. Metadata values never reject a report. The server bounds them the way the plugin does -- it drops a file repeating an earlier file's path, over-long and repeated keys, a session value with a status it cannot have, and every key past the per-run entry bound, files first; it records a document past the per-file or per-report size as too_large or over_budget without parsing it, and a value past the per-value size as value_too_large. Each key is stored once, by the first report carrying it.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SessionReport'}}}}
      responses:
        "201": {description: "Stored, a new run.", content: {application/json: {schema: {$ref: '#/components/schemas/Acknowledgement'}}}}
        "200": {description: "The run already existed. This report's finish fields, results and metadata were applied where the run did not have them yet; nothing already stored was replaced. A run already finished takes nothing from a later report.", content: {application/json: {schema: {$ref: '#/components/schemas/Acknowledgement'}}}}
        "400": {description: "The body is not UTF-8 JSON (invalid_json) -- NaN and Infinity are not JSON -- or the client disconnected before sending all of it (incomplete_body).", content: &rejection {application/json: {schema: {$ref: '#/components/schemas/Rejection'}}}}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the record scope (insufficient_scope).", content: *rejection}
        "409": {description: "The run was recorded by another user, or without a token when this report has one, or with one when it has none (foreign_run). Nothing of the report is stored.", content: *rejection}
        "413": {description: "The body exceeds 1 MiB (payload_too_large).", content: *rejection}
        "415": {description: "Content-Type is not application/json (unsupported_media_type).", content: *rejection}
        "422": {description: "The body does not match SessionReport (invalid_report); fields names each failing field.", content: *rejection}
    get:
      operationId: list_runs
      tags: [read]
      summary: Page through recorded runs, newest first.
      description: "metadata_key and metadata_value filter the list by key=value pairs, the n-th value pairing with the n-th key, so each is repeated once per pair -- ?metadata_key=a&metadata_value=1&metadata_key=b&metadata_value=2. A run matches when it holds every pair: a captured value exactly equal, read from a declared file or reported by the session. A run recorded before a key ever appeared has no value for it and is excluded; metadata_horizon in the response reports, for each distinct filtered key in the order first given, how many runs predate it (null when no metadata filter was given). A pair holding U+0000 matches no run; its key's horizon is that of the key with U+0000 replaced by U+FFFD, the text a report carrying it stored."
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/cursor'
        - {name: metadata_key, in: query, required: false, schema: {type: array, items: {type: string}, maxItems: 16}}
        - {name: metadata_value, in: query, required: false, schema: {type: array, items: {type: string}, maxItems: 16}}
      responses:
        "200": {description: A page of runs., content: {application/json: {schema: {$ref: '#/components/schemas/RunListResponse'}}}}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope).", content: *rejection}
        "422": {description: "limit below 1 or offset out of range -- not a page; or a cursor no page handed out, or a cursor with a non-zero offset; or metadata_key and metadata_value repeated a different number of times, or more than 16 pairs (invalid_parameter).", content: *rejection}
  /runs/{run_id}:
    get:
      operationId: get_run_detail
      tags: [read]
      summary: The full record for one run, with its untruncated commit subject.
      parameters:
        - $ref: '#/components/parameters/run_id'
      responses:
        "200": {description: The run., content: {application/json: {schema: {$ref: '#/components/schemas/RunDetailResponse'}}}}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope).", content: *rejection}
        "404": {description: No run with that id has been recorded., content: *rejection}
        "422": {description: run_id is not 32 lowercase hex characters (invalid_parameter)., content: *rejection}
  /runs/{run_id}/metadata:
    get:
      operationId: get_run_metadata
      tags: [read]
      summary: Every metadata key one run reported, ordered by key, and every file it declared.
      description: Keys read from declared files and keys the test session reported itself alike; source tells them apart. files lists each declared file, ordered by path, with the status that says whether it was read and, if not, why its keys have no value. Not paged -- a run holds at most 200 keys. A run that reported no metadata has no items and no files.
      parameters:
        - $ref: '#/components/parameters/run_id'
      responses:
        "200": {description: The run's metadata., content: {application/json: {schema: {$ref: '#/components/schemas/RunMetadataResponse'}}}}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope).", content: *rejection}
        "404": {description: No run with that id has been recorded., content: *rejection}
        "422": {description: run_id is not 32 lowercase hex characters (invalid_parameter)., content: *rejection}
  /runs/{run_id}/heartbeat:
    post:
      operationId: heartbeat
      tags: [write]
      summary: Advance a run's last-contact timestamp.
      parameters:
        - $ref: '#/components/parameters/run_id'
      responses:
        "200": {description: Acknowledged., content: {application/json: {schema: {$ref: '#/components/schemas/HeartbeatAcknowledgement'}}}}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the record scope (insufficient_scope).", content: *rejection}
        "404": {description: No run with that id has been recorded., content: *rejection}
        "409": {description: "The run was recorded by another user, or without a token when this heartbeat has one, or with one when it has none (foreign_run).", content: *rejection}
        "422": {description: run_id is not 32 lowercase hex characters (invalid_parameter)., content: *rejection}
  /runs/{run_id}/results:
    get:
      operationId: list_results
      tags: [read]
      summary: Page through one run's results.
      parameters:
        - $ref: '#/components/parameters/run_id'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        "200": {description: A page of results., content: {application/json: {schema: {$ref: '#/components/schemas/ResultsResponse'}}}}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope).", content: *rejection}
        "404": {description: No run with that id has been recorded., content: *rejection}
        "422": {description: "limit below 1 or offset out of range -- not a page; or run_id is not 32 lowercase hex characters (invalid_parameter).", content: *rejection}
  /runs/{run_id}/result:
    get:
      operationId: get_result
      tags: [read]
      summary: The full record for one result, unbounded by any list display width.
      description: node_id is a named query parameter, not a path segment, because a node id may contain `/` -- the same as on /tests/history. A node_id holding U+0000 names no result.
      parameters:
        - $ref: '#/components/parameters/run_id'
        - {name: node_id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: The result., content: {application/json: {schema: {$ref: '#/components/schemas/ResultDetailResponse'}}}}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope).", content: *rejection}
        "404": {description: "No run with that id has been recorded (unknown_run), or the run has no result with that node_id (unknown_result).", content: *rejection}
        "422": {description: "node_id missing (invalid_identity); or run_id is not 32 lowercase hex characters (invalid_parameter).", content: *rejection}
  /tests/history:
    get:
      operationId: list_history
      tags: [read]
      summary: A test's execution history, newest first, by its node id.
      description: node_id is a named query parameter on an identity-free path, not a path segment, because a node id may contain `/`. The parameter name is the identity scheme, so another scheme can later be added as a sibling parameter. A node_id holding U+0000 has no history.
      parameters:
        - {name: node_id, in: query, required: true, schema: {type: string}}
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/cursor'
      responses:
        "200": {description: "A page of history entries; empty, not an error, for an unknown node_id.", content: {application/json: {schema: {$ref: '#/components/schemas/HistoryResponse'}}}}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope).", content: *rejection}
        "422": {description: "node_id missing (invalid_identity); or limit below 1 or offset out of range, or a cursor no page handed out, or a cursor with a non-zero offset (invalid_parameter).", content: *rejection}
  /capabilities:
    get:
      operationId: capabilities
      tags: [read]
      security: []
      summary: The compatibility advertisement.
      description: A server that predates this path answers 404, which a client reads as every capability absent.
      responses:
        "200":
          description: The single advertised capability.
          content: {application/json: {schema: {type: object, required: [session_lifecycle], properties: {session_lifecycle: {type: boolean}}}}}
  /openapi.yaml:
    get:
      operationId: get_openapi_document
      tags: [read]
      security: []
      summary: This document, served as raw bytes.
      responses:
        "200": {description: The hand-written OpenAPI 3.1 YAML., content: {application/yaml: {schema: {type: string}}}}
  /config/sections:
    get:
      operationId: list_sections
      tags: [read]
      summary: List every defined test section.
      responses:
        "200": {description: Every stored section., content: {application/json: {schema: {$ref: '#/components/schemas/SectionListResponse'}}}}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope).", content: *rejection}
        "500": {description: A stored section's value could not be parsed (unreadable_setting)., content: *rejection}
    post:
      operationId: upsert_section
      tags: [write]
      summary: Create or update a section's prefix. A section name may contain `/`, so it travels as a body field, never as a path segment.
      description: A U+0000 in the name or the prefix is stored as U+FFFD; a lone surrogate in either is rejected.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SectionUpsertRequest'}}}}
      responses:
        "201": {description: Stored, a new section., content: {application/json: {schema: {$ref: '#/components/schemas/SectionResponse'}}}}
        "200": {description: Updated; the name was already stored., content: {application/json: {schema: {$ref: '#/components/schemas/SectionResponse'}}}}
        "400": {description: "The body is not UTF-8 JSON (invalid_json), or the client disconnected before sending all of it (incomplete_body).", content: *rejection}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the admin scope, or its user is not an admin (insufficient_scope).", content: *rejection}
        "413": {description: "The body exceeds 64 KiB (payload_too_large).", content: *rejection}
        "415": {description: "Content-Type is not application/json (unsupported_media_type).", content: *rejection}
        "422": {description: "An invalid name (invalid_section_name) or a reserved one (reserved_section_name), an invalid prefix (invalid_section_prefix), the stored-section count bound (too_many_sections), or a body that does not match SectionUpsertRequest (invalid_section).", content: *rejection}
    delete:
      operationId: delete_section
      tags: [write]
      summary: Delete a section by name.
      description: name is a query value, not a path segment, because a section name may contain `/`. A name holding U+0000 names no section.
      parameters:
        - {name: name, in: query, required: true, schema: {type: string}}
      responses:
        "204": {description: Deleted.}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the admin scope, or its user is not an admin (insufficient_scope).", content: *rejection}
        "404": {description: No section with that name has been stored., content: *rejection}
        "422": {description: name missing (invalid_parameter)., content: *rejection}
  /runs/{run_id}/sections:
    get:
      operationId: get_run_sections
      tags: [read]
      summary: One run's section summary -- every defined section, plus the always-present unassigned bucket.
      description: Section definitions are read fresh on every call, never cached; classification happens at read time.
      parameters:
        - $ref: '#/components/parameters/run_id'
      responses:
        "200": {description: The run's section summary., content: {application/json: {schema: {$ref: '#/components/schemas/RunSectionSummaryResponse'}}}}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the read scope (insufficient_scope).", content: *rejection}
        "404": {description: No run with that id has been recorded., content: *rejection}
        "422": {description: run_id is not 32 lowercase hex characters (invalid_parameter)., content: *rejection}
        "500": {description: A stored section's value could not be parsed (unreadable_setting)., content: *rejection}
  /users:
    get:
      operationId: list_users
      tags: [read, users]
      security: [{bearer: []}]
      summary: Every user, disabled ones included, by name.
      description: Returned whole, not paged, as vantage user list prints them.
      responses:
        "200": {description: Every user., content: {application/json: {schema: {$ref: '#/components/schemas/UserListResponse'}}}}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the admin scope, or its user is not an admin (insufficient_scope).", content: *rejection}
        "409": {description: "The server has no user yet, so no token can manage users; the vantage command adds the first (open_server).", content: *rejection}
    post:
      operationId: create_user
      tags: [write, users]
      security: [{bearer: []}]
      summary: Add an enabled user, as vantage user add does.
      description: The first user is never made here -- a server with no user answers 409 open_server -- but only by the vantage command. The name is never repeated in a rejection.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserCreateRequest'}}}}
      responses:
        "201": {description: The user, enabled., content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}
        "400": {description: "The body is not UTF-8 JSON (invalid_json), or the client disconnected before sending all of it (incomplete_body).", content: *rejection}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the admin scope, or its user is not an admin (insufficient_scope).", content: *rejection}
        "409": {description: "The server has no user yet, so no token can manage users; the vantage command adds the first (open_server); or a user with that name exists already (user_exists).", content: *rejection}
        "413": {description: "The body exceeds 16 KiB (payload_too_large).", content: *rejection}
        "415": {description: "Content-Type is not application/json (unsupported_media_type).", content: *rejection}
        "422": {description: "The body does not match UserCreateRequest -- a field missing, of the wrong type or unknown (invalid_user_request); or the name is not one a user can have (invalid_user_name).", content: *rejection}
  /users/{name}:
    patch:
      operationId: update_user
      tags: [write, users]
      security: [{bearer: []}]
      summary: Make a user an admin or not, enabled or disabled, as vantage user update does.
      description: "Each field given and not null is set; at least one must be. An admin cannot demote or disable their own user here: another admin can, or vantage user update on the database. A disabled user's tokens authenticate nothing until it is enabled again."
      parameters:
        - $ref: '#/components/parameters/user_name'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserUpdateRequest'}}}}
      responses:
        "200": {description: The user as it now stands., content: {application/json: {schema: {$ref: '#/components/schemas/UserResponse'}}}}
        "400": {description: "The body is not UTF-8 JSON (invalid_json), or the client disconnected before sending all of it (incomplete_body).", content: *rejection}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the admin scope, or its user is not an admin (insufficient_scope).", content: *rejection}
        "404": {description: "No user with that name exists, or none can (unknown_user).", content: *rejection}
        "409": {description: "The server has no user yet, so no token can manage users; the vantage command adds the first (open_server); or the change would demote or disable the caller's own user (own_account).", content: *rejection}
        "413": {description: "The body exceeds 16 KiB (payload_too_large).", content: *rejection}
        "415": {description: "Content-Type is not application/json (unsupported_media_type).", content: *rejection}
        "422": {description: "The body does not match UserUpdateRequest, or changes nothing (invalid_user_request).", content: *rejection}
  /tokens:
    get:
      operationId: list_tokens
      tags: [read, users]
      security: [{bearer: []}]
      summary: Every token, or one user's, revoked ones included, oldest first.
      description: Returned whole, not paged, as vantage token list prints them. A token is never in it -- only its SHA-256 is stored.
      parameters:
        - $ref: '#/components/parameters/token_user'
      responses:
        "200": {description: The tokens., content: {application/json: {schema: {$ref: '#/components/schemas/TokenListResponse'}}}}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the admin scope, or its user is not an admin (insufficient_scope).", content: *rejection}
        "409": {description: "The server has no user yet, so no token can manage users; the vantage command adds the first (open_server).", content: *rejection}
    post:
      operationId: create_token
      tags: [write, users]
      security: [{bearer: []}]
      summary: Make a token for a user, as vantage token create does, and answer it this once.
      description: "The token is in this answer only, which is not to be stored (Cache-Control: no-store). A token holds read and record unless scopes names others; the admin scope only for an admin user. A U+0000 in the label is stored as U+FFFD; a lone surrogate in it is rejected. A disabled user's token is made, and authenticates nothing until the user is enabled. Minting a token for another user lets its bearer record runs as that user."
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TokenCreateRequest'}}}}
      responses:
        "201":
          description: The token, shown this once, and what the server keeps of it.
          headers: {Cache-Control: {description: "no-store: the token is shown this once.", schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/CreatedTokenResponse'}}}
        "400": {description: "The body is not UTF-8 JSON (invalid_json), or the client disconnected before sending all of it (incomplete_body).", content: *rejection}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the admin scope, or its user is not an admin (insufficient_scope).", content: *rejection}
        "404": {description: "No user with that name exists, or none can (unknown_user).", content: *rejection}
        "409": {description: "The server has no user yet, so no token can manage users; the vantage command adds the first (open_server); or the admin scope was asked for a user who is not an admin (not_an_admin).", content: *rejection}
        "413": {description: "The body exceeds 16 KiB (payload_too_large).", content: *rejection}
        "415": {description: "Content-Type is not application/json (unsupported_media_type).", content: *rejection}
        "422": {description: "The body does not match TokenCreateRequest (invalid_token_request); no scope, or one that is not a scope (invalid_scopes); or a label over 200 characters or holding a control character other than U+0000, or a lone surrogate (invalid_token_label).", content: *rejection}
  /tokens/{token_id}/revoke:
    post:
      operationId: revoke_token
      tags: [write, users]
      security: [{bearer: []}]
      summary: Revoke a token.
      description: Idempotent. A token revoked already answers 200 with the time it was first revoked. The token authenticates nothing from the next request on, the caller's own included. The body is not read.
      parameters:
        - $ref: '#/components/parameters/token_id'
      responses:
        "200": {description: The token, revoked., content: {application/json: {schema: {$ref: '#/components/schemas/TokenResponse'}}}}
        "401": {description: "No token, on a server that has users; or a token that is not valid -- unknown, revoked, or of a disabled user -- on any server (unauthenticated).", content: *rejection}
        "403": {description: "The token does not grant the admin scope, or its user is not an admin (insufficient_scope).", content: *rejection}
        "404": {description: "No token with that id exists (unknown_token).", content: *rejection}
        "409": {description: "The server has no user yet, so no token can manage users; the vantage command adds the first (open_server).", content: *rejection}
        "422": {description: "token_id is not an integer from 1 to 9223372036854775807 (invalid_parameter).", content: *rejection}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, description: "A token `vantage token create` printed, or the admin API returned. Each holds one or more of the read, record and admin scopes."}
  parameters:
    run_id: {name: run_id, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{32}$'}}
    # No `maximum`. A caller asking for more than 200 gets 200, not a
    # rejection -- someone requesting a large page wants data, not an
    # error. `maximum: 200` would assert a constraint the server does not
    # enforce, and a strict generated client would refuse a request the
    # server answers happily. The cap is stated as behaviour instead.
    limit: {name: limit, in: query, required: false, description: "Page size. Values above 200 are clamped to 200; the response reports whether more items exist. A value below 1 is rejected with 422 -- it is not a page size.", schema: {type: integer, minimum: 1}}
    offset: {name: offset, in: query, required: false, schema: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}}
    user_name: {name: name, in: path, required: true, description: "A user's name; one no user can have answers 404.", schema: {type: string}}
    token_user: {name: user, in: query, required: false, description: "Only this user's tokens; a name nobody has lists none.", schema: {type: string}}
    token_id: {name: token_id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}}
    cursor: {name: cursor, in: query, required: false, description: "The next_cursor a previous page of the same list returned. The page starts just past the last run that page listed, so runs recorded in between never repeat or shift a run onto it, as they do under an offset. Opaque: pass it back unchanged. Not combined with a non-zero offset.", schema: {type: string, maxLength: 128}}
  schemas:
    # Request and response bodies are both stated in full: this document is
    # the contract for what the server accepts and what it returns, and a
    # `type: object` stub would leave a generated client guessing.
    #
    # That duplicates the Pydantic models -- `ingestion/schemas.py` for the
    # report, `service/schemas.py` for the rest -- and the schema checks at
    # the end of `test_interface_document.py` bound the duplication. They
    # parse this file and read `model_fields` independently -- neither side is
    # generated from the other -- and compare, in both directions:
    #
    #   * which schemas are declared, against the models bound to them, and
    #     that every model reachable from a bound one is bound too;
    #   * each schema's property names, against its model's field names;
    #   * each schema's `required` list (what the client must send on a
    #     request, what it can rely on receiving in a response);
    #   * whether each property admits `null`, against whether the field's
    #     annotation admits `None`;
    #   * each `$ref`, against the model the field actually holds;
    #   * `additionalProperties`, against the model's `extra` setting;
    #   * every declared `enum`, against `OUTCOMES` / `PRESENTATIONS` and the
    #     metadata vocabularies -- the domain frozensets that decide what the
    #     server can emit.
    #
    # Not checked here: the JSON `type` and `format` keywords, `default`, and
    # the `pattern` / `maxLength` constraints. A `string` declared where the
    # model holds an `int` would drift silently. The integer `minimum` /
    # `maximum` bounds are checked against the running server instead.
    SessionReport:
      type: object
      required: [run]
      properties: {run: {$ref: '#/components/schemas/RunReport'}, results: {type: [array, "null"], items: {$ref: '#/components/schemas/ResultReport'}}, vcs: {oneOf: [{$ref: '#/components/schemas/VcsReport'}, {type: "null"}]}, metadata: {oneOf: [{$ref: '#/components/schemas/MetadataReport'}, {type: "null"}]}}
    RunReport:
      type: object
      required: [id, started_at, finished_at, exit_status, interrupted, interrupt_reason]
      additionalProperties: false
      properties: {id: {type: string, pattern: '^[0-9a-f]{32}$'}, started_at: {type: string, format: date-time}, finished_at: {type: [string, "null"], format: date-time}, exit_status: {type: [integer, "null"], format: int64, minimum: -9223372036854775808, maximum: 9223372036854775807}, interrupted: {type: boolean}, interrupt_reason: {type: [string, "null"]}}
    # An unknown key on one result is tolerated and named back in
    # `Acknowledgement.ignored`; the failure and captured-output fields are
    # optional, because an older plugin sends none of them.
    ResultReport:
      type: object
      required: [node_id, file_path, class_name, function_name, param_id, outcome, duration, started_at, finished_at, setup_outcome, call_outcome, teardown_outcome, setup_duration, call_duration, teardown_duration, worker_id]
      additionalProperties: true
      properties: {node_id: {type: string}, file_path: {type: string}, class_name: {type: [string, "null"]}, function_name: {type: string}, param_id: {type: [string, "null"]}, outcome: {type: string, enum: [passed, failed, error, skipped, xfailed, xpassed]}, duration: {type: [number, "null"]}, started_at: {type: [string, "null"], format: date-time}, finished_at: {type: [string, "null"], format: date-time}, setup_outcome: {type: [string, "null"], enum: [passed, failed, error, skipped, xfailed, xpassed, null]}, call_outcome: {type: [string, "null"], enum: [passed, failed, error, skipped, xfailed, xpassed, null]}, teardown_outcome: {type: [string, "null"], enum: [passed, failed, error, skipped, xfailed, xpassed, null]}, setup_duration: {type: [number, "null"]}, call_duration: {type: [number, "null"]}, teardown_duration: {type: [number, "null"]}, worker_id: {type: [string, "null"]}, failure_type: {type: [string, "null"], default: null}, failure_message: {type: [string, "null"], default: null}, failure_message_truncated: {type: boolean, default: false}, failure_path: {type: [string, "null"], default: null}, failure_lineno: {type: [integer, "null"], format: int64, minimum: -9223372036854775808, maximum: 9223372036854775807, default: null}, failure_repr: {type: [string, "null"], default: null}, failure_repr_truncated: {type: boolean, default: false}, traceback: {type: [string, "null"], default: null}, traceback_truncated: {type: boolean, default: false}, skip_reason: {type: [string, "null"], default: null}, skip_reason_truncated: {type: boolean, default: false}, xfail_reason: {type: [string, "null"], default: null}, xfail_reason_truncated: {type: boolean, default: false}, captured_stdout: {type: [string, "null"], default: null}, captured_stdout_truncated: {type: boolean, default: false}, captured_stderr: {type: [string, "null"], default: null}, captured_stderr_truncated: {type: boolean, default: false}}
    VcsReport:
      type: object
      required: [commit, branch, commit_subject, dirty, root]
      additionalProperties: false
      properties: {commit: {type: [string, "null"], maxLength: 64}, branch: {type: [string, "null"]}, commit_subject: {type: [string, "null"]}, dirty: {type: [boolean, "null"]}, root: {type: [string, "null"]}}
    # `declaration` is null when the session had no declaration file. `keys`
    # maps a declared key to what the declaration says about it; `values` are
    # the keys the session reported itself, and only a session's last report
    # carries them.
    MetadataReport:
      type: object
      required: [declaration]
      additionalProperties: false
      properties: {declaration: {type: [string, "null"]}, keys: {type: object, additionalProperties: {$ref: '#/components/schemas/MetadataKeyReport'}, default: {}}, files: {type: array, items: {$ref: '#/components/schemas/MetadataFileReport'}, default: []}, values: {type: array, items: {$ref: '#/components/schemas/MetadataValueReport'}, default: []}}
    # A name over 256 characters is stored as no name; the key is kept.
    MetadataKeyReport:
      type: object
      additionalProperties: false
      properties: {name: {type: [string, "null"], default: null}}
    # No constraint on any field, as for a file. `status` is captured, absent
    # or value_too_large, and `value` is null unless it is captured: an entry
    # with any other status is dropped, and one whose value contradicts its
    # status is stored as absent. A key a file already gave, or an earlier
    # entry, keeps that value.
    MetadataValueReport:
      type: object
      required: [key, value, status]
      additionalProperties: false
      properties: {key: {type: string}, value: {type: [string, "null"]}, status: {type: string}}
    # No constraint on any field: a declared value is text this project does
    # not control, so the server drops what it cannot store rather than
    # rejecting the report. `content` is null unless `status` is `captured`.
    MetadataFileReport:
      type: object
      required: [path, format, status, keys, content]
      additionalProperties: false
      properties: {path: {type: string}, format: {type: string}, status: {type: string}, keys: {type: array, items: {type: string}}, content: {type: [string, "null"]}}
    # The one body every rejection has. `detail` is a fixed sentence and
    # `fields` holds dotted field paths; neither ever repeats a submitted
    # value.
    Rejection:
      type: object
      required: [error, detail, fields]
      properties: {error: {type: string}, detail: {type: string}, fields: {type: array, items: {type: string}}}
    Acknowledgement:
      type: object
      required: [run_id, status, ignored]
      properties: {run_id: {type: string}, status: {type: string}, ignored: {type: array, items: {type: string}}}
    HeartbeatAcknowledgement:
      type: object
      required: [run_id, status]
      properties: {run_id: {type: string}, status: {type: string}}
    # No `root`. `VcsContext` carries one; this model has no field to
    # populate, which is what keeps a reporter's absolute path off the wire
    # on the detail path where no type stops it.
    RunVcs:
      type: object
      required: [commit, branch, commit_subject, commit_subject_truncated, dirty]
      properties: {commit: {type: [string, "null"]}, branch: {type: [string, "null"]}, commit_subject: {type: [string, "null"]}, commit_subject_truncated: {type: boolean}, dirty: {type: [boolean, "null"]}}
    RunListItem:
      type: object
      required: [id, started_at, finished_at, exit_status, interrupted, presentation, vcs, recorded_by]
      properties: {id: {type: string, pattern: '^[0-9a-f]{32}$'}, started_at: {type: string, format: date-time}, finished_at: {type: [string, "null"], format: date-time}, exit_status: {type: [integer, "null"]}, interrupted: {type: boolean}, presentation: {type: string, enum: [running, finished, interrupted, abandoned]}, vcs: {oneOf: [{$ref: '#/components/schemas/RunVcs'}, {type: "null"}]}, recorded_by: {type: [string, "null"], description: "The user whose token created the run; null for one recorded without a token."}}
    # One per distinct filtered key, in the order first given. `predating`
    # equals the total run count when no run ever carried `key`.
    MetadataHorizon:
      type: object
      required: [key, predating]
      properties: {key: {type: string}, predating: {type: integer}}
    RunListResponse:
      type: object
      required: [items, has_more, next_cursor, metadata_horizon]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/RunListItem'}}, has_more: {type: boolean}, next_cursor: {type: [string, "null"], description: "The cursor for the page after this one; null on the last page."}, metadata_horizon: {type: [array, "null"], items: {$ref: '#/components/schemas/MetadataHorizon'}}}
    # Carries `interrupt_reason` and an untruncated `commit_subject`, which
    # the lean list entry omits -- the detail path keeps the full record
    # reachable.
    RunDetailResponse:
      type: object
      required: [id, started_at, finished_at, exit_status, interrupted, interrupt_reason, presentation, vcs, recorded_by]
      properties: {id: {type: string, pattern: '^[0-9a-f]{32}$'}, started_at: {type: string, format: date-time}, finished_at: {type: [string, "null"], format: date-time}, exit_status: {type: [integer, "null"]}, interrupted: {type: boolean}, interrupt_reason: {type: [string, "null"]}, presentation: {type: string, enum: [running, finished, interrupted, abandoned]}, vcs: {oneOf: [{$ref: '#/components/schemas/RunVcs'}, {type: "null"}]}, recorded_by: {type: [string, "null"], description: "The user whose token created the run; null for one recorded without a token."}}
    # `source_file` names the declared file of a `file` key and is null for a
    # `session` one; `value` is null unless `status` is `captured`; `name`
    # is the display name the run's declaration gave the key.
    MetadataItem:
      type: object
      required: [key, name, value, status, source, source_file, declared]
      properties: {key: {type: string}, name: {type: [string, "null"]}, value: {type: [string, "null"]}, status: {type: string, enum: [captured, absent, not_scalar, value_too_large, source_unavailable]}, source: {type: string, enum: [file, session]}, source_file: {type: [string, "null"]}, declared: {type: boolean}}
    MetadataFile:
      type: object
      required: [source_file, content_type, status]
      properties: {source_file: {type: string}, content_type: {type: string, enum: [json, yaml]}, status: {type: string, enum: [captured, not_found, path_rejected, too_large, not_text, unreadable, over_budget, malformed]}}
    RunMetadataResponse:
      type: object
      required: [items, files]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/MetadataItem'}}, files: {type: array, items: {$ref: '#/components/schemas/MetadataFile'}}}
    # No traceback, failure_repr or captured output at any depth -- a
    # results list never carries them; the single-result endpoint does.
    FailureProjection:
      type: object
      required: [failure_type, failure_message, failure_message_truncated, failure_path, failure_lineno, skip_reason, xfail_reason]
      properties: {failure_type: {type: [string, "null"]}, failure_message: {type: [string, "null"]}, failure_message_truncated: {type: boolean}, failure_path: {type: [string, "null"]}, failure_lineno: {type: [integer, "null"]}, skip_reason: {type: [string, "null"]}, xfail_reason: {type: [string, "null"]}}
    ResultListItem:
      type: object
      required: [node_id, file_path, class_name, function_name, param_id, outcome, duration, started_at, finished_at, setup_outcome, call_outcome, teardown_outcome, setup_duration, call_duration, teardown_duration, worker_id, failure]
      properties: {node_id: {type: string}, file_path: {type: string}, class_name: {type: [string, "null"]}, function_name: {type: string}, param_id: {type: [string, "null"]}, outcome: {type: string, enum: [passed, failed, error, skipped, xfailed, xpassed]}, duration: {type: [number, "null"]}, started_at: {type: [string, "null"], format: date-time}, finished_at: {type: [string, "null"], format: date-time}, setup_outcome: {type: [string, "null"]}, call_outcome: {type: [string, "null"]}, teardown_outcome: {type: [string, "null"]}, setup_duration: {type: [number, "null"]}, call_duration: {type: [number, "null"]}, teardown_duration: {type: [number, "null"]}, worker_id: {type: [string, "null"]}, failure: {oneOf: [{$ref: '#/components/schemas/FailureProjection'}, {type: "null"}]}}
    ResultsResponse:
      type: object
      required: [items, has_more]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/ResultListItem'}}, has_more: {type: boolean}}
    # The single-result endpoint's response -- every field a list response
    # bounds or excludes, unbounded, flat like `ResultReport`'s own wire
    # shape rather than nesting `failure`/`captured`.
    ResultDetailResponse:
      type: object
      required: [node_id, file_path, class_name, function_name, param_id, outcome, duration, started_at, finished_at, setup_outcome, call_outcome, teardown_outcome, setup_duration, call_duration, teardown_duration, worker_id, failure_type, failure_message, failure_message_truncated, failure_path, failure_lineno, failure_repr, failure_repr_truncated, traceback, traceback_truncated, skip_reason, skip_reason_truncated, xfail_reason, xfail_reason_truncated, captured_stdout, captured_stdout_truncated, captured_stderr, captured_stderr_truncated]
      properties: {node_id: {type: string}, file_path: {type: string}, class_name: {type: [string, "null"]}, function_name: {type: string}, param_id: {type: [string, "null"]}, outcome: {type: string, enum: [passed, failed, error, skipped, xfailed, xpassed]}, duration: {type: [number, "null"]}, started_at: {type: [string, "null"], format: date-time}, finished_at: {type: [string, "null"], format: date-time}, setup_outcome: {type: [string, "null"]}, call_outcome: {type: [string, "null"]}, teardown_outcome: {type: [string, "null"]}, setup_duration: {type: [number, "null"]}, call_duration: {type: [number, "null"]}, teardown_duration: {type: [number, "null"]}, worker_id: {type: [string, "null"]}, failure_type: {type: [string, "null"]}, failure_message: {type: [string, "null"]}, failure_message_truncated: {type: boolean}, failure_path: {type: [string, "null"]}, failure_lineno: {type: [integer, "null"]}, failure_repr: {type: [string, "null"]}, failure_repr_truncated: {type: boolean}, traceback: {type: [string, "null"]}, traceback_truncated: {type: boolean}, skip_reason: {type: [string, "null"]}, skip_reason_truncated: {type: boolean}, xfail_reason: {type: [string, "null"]}, xfail_reason_truncated: {type: boolean}, captured_stdout: {type: [string, "null"]}, captured_stdout_truncated: {type: boolean}, captured_stderr: {type: [string, "null"]}, captured_stderr_truncated: {type: boolean}}
    HistoryEntry:
      type: object
      required: [run_id, started_at, finished_at, outcome, duration, vcs]
      properties: {run_id: {type: string, pattern: '^[0-9a-f]{32}$'}, started_at: {type: string, format: date-time}, finished_at: {type: [string, "null"], format: date-time}, outcome: {type: string, enum: [passed, failed, error, skipped, xfailed, xpassed]}, duration: {type: [number, "null"]}, vcs: {oneOf: [{$ref: '#/components/schemas/RunVcs'}, {type: "null"}]}}
    HistoryResponse:
      type: object
      required: [items, has_more, next_cursor]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/HistoryEntry'}}, has_more: {type: boolean}, next_cursor: {type: [string, "null"], description: "The cursor for the page after this one; null on the last page."}}
    SectionUpsertRequest:
      type: object
      required: [name, prefix]
      properties: {name: {type: string}, prefix: {type: string}}
    SectionResponse:
      type: object
      required: [name, prefix]
      properties: {name: {type: string}, prefix: {type: string}}
    SectionListResponse:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/SectionResponse'}}}
    SectionSummary:
      type: object
      required: [name, total, measured, passing, pass_percentage]
      properties: {name: {type: string}, total: {type: integer}, measured: {type: integer}, passing: {type: integer}, pass_percentage: {type: [number, "null"]}}
    RunSectionSummaryResponse:
      type: object
      required: [items, unassigned]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/SectionSummary'}}, unassigned: {$ref: '#/components/schemas/SectionSummary'}}
    # Users and tokens. The request bodies refuse an unknown field, and take
    # a boolean only as a JSON boolean. A token is in CreatedTokenResponse
    # alone; no other body carries it, or its digest.
    UserCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties: {name: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}, admin: {type: boolean, default: false}}
    UserUpdateRequest:
      type: object
      description: At least one of admin and disabled must be given and not null.
      additionalProperties: false
      properties: {admin: {type: [boolean, "null"], default: null}, disabled: {type: [boolean, "null"], default: null}}
    TokenCreateRequest:
      type: object
      required: [user]
      additionalProperties: false
      properties: {user: {type: string}, scopes: {type: array, items: {type: string, enum: [admin, read, record]}, minItems: 1, default: [read, record]}, label: {type: string, maxLength: 200, default: ""}}
    UserResponse:
      type: object
      required: [name, admin, disabled, created_at]
      properties: {name: {type: string}, admin: {type: boolean}, disabled: {type: boolean}, created_at: {type: string, format: date-time}}
    UserListResponse:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/UserResponse'}}}
    TokenResponse:
      type: object
      required: [id, user, label, scopes, created_at, revoked_at]
      properties: {id: {type: integer, format: int64}, user: {type: string}, label: {type: string}, scopes: {type: array, items: {type: string, enum: [admin, read, record]}}, created_at: {type: string, format: date-time}, revoked_at: {type: [string, "null"], format: date-time}}
    TokenListResponse:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/TokenResponse'}}}
    CreatedTokenResponse:
      type: object
      required: [token, id, user, label, scopes, created_at, revoked_at]
      properties: {token: {type: string, description: "The token, shown this once."}, id: {type: integer, format: int64}, user: {type: string}, label: {type: string}, scopes: {type: array, items: {type: string, enum: [admin, read, record]}}, created_at: {type: string, format: date-time}, revoked_at: {type: [string, "null"], format: date-time}}
