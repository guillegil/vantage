  /projects/{project}/members/{user}:
    put:
      operationId: set_member
      tags: [write, members]
      security: [{bearer: []}, {session: []}]
      summary: Make a user a member of the project with a role, or set a member's role, as vantage project member set does.
      description: "Idempotent: setting a member's role again, the same one included, answers 200. An owner may give any role, owner included, and demote any member, themselves included; an admin acts as an owner of every project without being a member, so an admin can always repair one. An admin or a disabled user may be made a member; a disabled user's role grants nothing while their tokens authenticate nothing. After who asks and the project, the media type is checked, then default, then a name no user can have, answered before the body is read; a user nobody has is answered last. Neither the name nor the role is ever repeated in a rejection."
