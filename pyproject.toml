[project]
name = "vantage-workspace"
version = "0.1.0"
description = "Vantage: continuous pytest observability -- workspace root."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Guillermo Gil" }]
dependencies = [
    "vantage-core",
    "vantage-storage",
    "vantage-pytest",
    "vantage-service",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "deptry>=0.16",
    "pip-audit>=2.7",
]

# This root pyproject.toml is the uv workspace root, not a published
# distribution -- it carries no [build-system]. Each package under
# packages/ is its own published distribution with its own build backend.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
vantage-core = { workspace = true }
vantage-storage = { workspace = true }
vantage-pytest = { workspace = true }
vantage-service = { workspace = true }

# The only [tool.pytest.ini_options] in the workspace (D9). pytest reads
# exactly one ini file, resolved from rootdir; a package that declared its
# own would silently shadow this one when run from inside that package.
# A guard test (A1.4) enforces the invariant by scanning every package
# pyproject.toml for this section.
[tool.pytest.ini_options]
markers = [
    "req(id): the requirement (RQ-nn) this test verifies",
]
addopts = "--strict-markers"
pythonpath = ["packages/vantage-core/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/adr"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest tests fail; S101 exists for production code.
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
mypy_path = [
    "packages/vantage-core/src",
    "packages/vantage-storage/src",
    "packages/vantage-pytest/src",
    "packages/vantage-service/src",
]

[tool.deptry]
# Each package is scanned from its own directory; this root config sets
# workspace-wide defaults. DSL/dev tooling never counts as a runtime
# dependency, and vantage-core/vantage-storage/vantage-pytest must add no
# third-party runtime dependency at all (RQ-24).
ignore_notebooks = true

[tool.deptry.per_rule_ignores]
DEP002 = ["pytest-cov"]
