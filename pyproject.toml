[project]
name = "vantage-workspace"
version = "0.1.0"
description = "Vantage: continuous pytest observability -- workspace root."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Guillermo Gil" }]
dependencies = [
    "pytest-vantage",
    "vantage",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "deptry>=0.16",
    "pip-audit>=2.7",
    # `fastapi.testclient.TestClient` needs it (PR6); dev-only, never a
    # runtime dependency of `vantage` itself.
    "httpx2>=1.0",
    # Drives `create_app()` over a real TCP socket for the raw-socket
    # truncation test (PR8, task 3.7) -- `TestClient`'s ASGI transport hands
    # the whole body to `request.stream()` already assembled in memory, so
    # it can never observe a socket stopping mid-transfer. Dev-only: PR9's
    # `vantage serve` CLI is what adds it to `packages/vantage/pyproject.toml`
    # as a runtime dependency, together with `[project.scripts]`.
    "uvicorn>=0.30",
]

# This root pyproject.toml is the uv workspace root, not a published
# distribution -- it carries no [build-system]. Two distributions are
# published from packages/ (ADR-4), released independently through prefixed
# tags: pytest-vantage-vX.Y.Z and vantage-vX.Y.Z.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pytest-vantage = { workspace = true }
vantage = { workspace = true }

# The only [tool.pytest.ini_options] in the workspace (D9). pytest reads
# exactly one ini file, resolved from rootdir; a package that declared its
# own would silently shadow this one when run from inside that package.
# A guard test enforces the invariant by scanning every package
# pyproject.toml for this section.
[tool.pytest.ini_options]
markers = [
    "req(id): the requirement (RQ-nn) this test verifies",
]
addopts = "--strict-markers"
pythonpath = ["packages/vantage/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/adr", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest tests fail; S101 exists for production code.
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
mypy_path = [
    "packages/pytest-vantage/src",
    "packages/vantage/src",
]

[tool.deptry]
# pytest-vantage must declare nothing but pytest and import nothing outside
# the standard library (RQ-24). vantage.core must import only the standard
# library (RQ-26); both are also checked by the AST architecture test.
ignore_notebooks = true
