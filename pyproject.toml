[project]
name = "vantage-workspace"
version = "0.1.0"
description = "Vantage: continuous pytest observability -- workspace root."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Guillermo Gil" }]
dependencies = [
    "pytest-vantage",
    "vantage",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "deptry>=0.16",
    "pip-audit>=2.7",
    # `fastapi.testclient.TestClient` needs it; dev-only.
    "httpx2>=1.0",
    # The suite must pass both with and without xdist installed (CI runs
    # both); neither distribution depends on it.
    "pytest-xdist>=3.5",
    # `types-PyYAML` is the stub `mypy --strict` needs for `yaml`.
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    # The PostgreSQL adapter's driver, so its tests can run.
    "vantage[postgres]",
]

# This root pyproject.toml is the uv workspace root, not a published
# distribution -- it carries no [build-system]. Two distributions are
# published from packages/, released independently through prefixed tags:
# pytest-vantage-vX.Y.Z and vantage-vX.Y.Z.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pytest-vantage = { workspace = true }
vantage = { workspace = true }

# The workspace's only pytest configuration. pytest uses the first config
# file it finds walking up from the paths it is given, so a pytest.ini or
# pytest.toml, a pytest section in tox.ini or setup.cfg, or a [tool.pytest]
# table anywhere under packages/ would silently replace this one for runs on
# that directory, `pytest packages/<pkg>` from here included. A guard test
# fails if one appears.
[tool.pytest.ini_options]
markers = [
    # Opt OUT with `-m 'not slow'`, never opt in. The default run is the
    # complete one, so a slow test cannot quietly stop running because some
    # config drifted -- the same reason --strict-markers is on.
    "slow: measures real elapsed time and cannot be made fast without ceasing to measure",
    # Skipped, not failed, when VANTAGE_TEST_POSTGRES_URL is unset.
    "postgres: needs the PostgreSQL server VANTAGE_TEST_POSTGRES_URL names",
]
addopts = "--strict-markers"
pythonpath = ["packages/vantage/tests", "packages/pytest-vantage/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest tests fail; S101 exists for production code.
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
mypy_path = [
    "packages/pytest-vantage/src",
    "packages/vantage/src",
    "packages/vantage/tests",
    "packages/pytest-vantage/tests",
]

[tool.deptry]
# pytest-vantage must declare nothing but pytest and import nothing outside
# the standard library. vantage.core must import only the standard library;
# both are also checked by the AST architecture test.
ignore_notebooks = true

# deptry reads exactly one pyproject.toml (this one) and has no notion of a
# uv workspace, so it cannot see that fastapi/pydantic/starlette/uvicorn are
# declared in packages/vantage/pyproject.toml, and psycopg/psycopg_pool by
# its `postgres` extra, or that importwalk,
# loopback_server, memory_store, sqlite_rows, vantage_port_contract and
# vantage_test_server are real local test-support modules reached through
# the root `pythonpath` rather than missing packages. Per-module, per-rule
# ignores name exactly those known cases so a genuinely new undeclared import
# is still caught (verified: an ad hoc `import requests` probe was flagged
# even with this config in place).
# DEP002 additionally covers CLI-only dev tools (ruff, mypy, deptry,
# pip-audit) that are invoked via `uv run <tool>` and never imported as
# Python modules, plus pytest-xdist and httpx2, which are exercised through
# pytest's own plugin discovery and starlette's TestClient rather than a
# direct `import` in this project's code.
[tool.deptry.per_rule_ignores]
DEP001 = [
    "importwalk",
    "loopback_server",
    "memory_store",
    "sqlite_rows",
    "vantage_port_contract",
    "vantage_test_server",
]
# `types-PyYAML` is a stub package mypy reads, never itself imported --
# same category as the CLI-only tools below.
DEP002 = ["ruff", "mypy", "deptry", "pip-audit", "httpx2", "pytest-xdist", "types-PyYAML"]
DEP003 = ["fastapi", "pydantic", "starlette", "uvicorn", "psycopg", "psycopg_pool"]
